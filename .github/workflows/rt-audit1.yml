name: RT-AUDIT.1 parent-child reconciliation
on:
  pull_request:
    paths:
      - 'scripts/audit/rt-audit1-parent-child.mjs'
      - '.github/workflows/rt-audit1.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile all parent-child links and topology shards
        run: node scripts/audit/rt-audit1-parent-child.mjs
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-audit1-evidence
          path: outputs/RT-AUDIT.1/
          if-no-files-found: warn
