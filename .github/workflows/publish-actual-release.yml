name: Publish immutable ACTUAL release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. actual-v1.1.0"
        required: true
        type: string
      expected_main_sha:
        description: "Exact main commit SHA to release"
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      EXPECTED_SHA: ${{ inputs.expected_main_sha }}
    steps:
      - name: Validate release inputs and main binding
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^actual-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha="$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)"
          test "$main_sha" = "$EXPECTED_SHA"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          checks="$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/$EXPECTED_SHA/check-runs?per_page=100")"
          for required in verify-persisted-release actual-change-reproducibility actual-release-trust-chain; do
            conclusion="$(jq -r --arg n "$required" '[.check_runs[]|select(.name==$n)]|last|.conclusion // empty' <<<"$checks")"
            test "$conclusion" = success || { echo "$required is not successful" >&2; exit 1; }
          done

      - name: Check out exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify persisted ACTUAL release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .status data/current/actual-release-gate.json)" = PASS
          snapshot="$(jq -r '.snapshot_id // empty' data/current/actual-release-manifest.json)"
          fingerprint="$(jq -r '.release_fingerprint_sha256 // empty' data/current/actual-release-manifest.json)"
          contract="$(jq -r '.public_contract.contract // empty' data/current/actual-release-manifest.json)"
          [[ "$snapshot" =~ ^actual-[0-9a-f]{16}$ ]]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$contract" =~ ^actual-public-entity-v[0-9]+$ ]]
          echo "snapshot=$snapshot" >> "$GITHUB_ENV"
          echo "fingerprint=$fingerprint" >> "$GITHUB_ENV"
          echo "contract=$contract" >> "$GITHUB_ENV"

      - name: Build release evidence assets in pinned ACTUAL runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_ref="$(jq -r '.runtime.ref' data/current/actual-runtime-image.json)"
          expected_node="$(jq -r '.runtime.node' data/current/actual-runtime-image.json)"
          expected_npm="$(jq -r '.runtime.npm' data/current/actual-runtime-image.json)"
          [[ "$runtime_ref" =~ ^ghcr\.io/ovidiudeica/reforma-teritoriala-actual-runtime@sha256:[0-9a-f]{64}$ ]]
          [[ "$expected_node" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$expected_npm" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$runtime_ref"
          mkdir -p release-assets
          docker run --rm --network none \
            -e EXPECTED_NODE="$expected_node" \
            -e EXPECTED_NPM="$expected_npm" \
            -e RELEASE_TAG="$TAG" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$runtime_ref" \
            bash -lc '
              set -euo pipefail
              test "$(node --version)" = "v$EXPECTED_NODE"
              test "$(npm --version)" = "$EXPECTED_NPM"
              release_version="${RELEASE_TAG#actual-v}"
              [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
              sbom_root=/tmp/actual-sbom-input
              rm -rf "$sbom_root"
              mkdir -p "$sbom_root"
              cp package.json package-lock.json "$sbom_root/"
              SBOM_ROOT="$sbom_root" RELEASE_VERSION="$release_version" node --input-type=module <<'"'"'NODE'"'"'
          import {readFile,writeFile} from "node:fs/promises";
          import {join} from "node:path";
          const root=process.env.SBOM_ROOT;
          const version=process.env.RELEASE_VERSION;
          for (const name of ["package.json","package-lock.json"]) {
            const path=join(root,name);
            const json=JSON.parse(await readFile(path,"utf8"));
            if (name==="package.json") json.version=version;
            else {
              json.version=version;
              json.packages ??= {};
              json.packages[""] ??= {};
              json.packages[""].version=version;
            }
            await writeFile(path,JSON.stringify(json,null,2)+"\n");
          }
          NODE
              (
                cd "$sbom_root"
                npm sbom --package-lock-only --sbom-format cyclonedx
              ) > release-assets/actual-sbom.cdx.json
              cp data/current/actual-release-manifest.json release-assets/
              cp data/current/actual-source-bundle-manifest.json release-assets/
              cp data/current/actual-review-evidence-bundle.json release-assets/
              cp docs/actual-v1-known-limitations.md release-assets/
              (
                cd release-assets
                sha256sum actual-release-manifest.json actual-source-bundle-manifest.json actual-review-evidence-bundle.json actual-sbom.cdx.json actual-v1-known-limitations.md > actual-release-checksums.sha256
              )
            '
          docker logout ghcr.io

          # BEGIN RELEASE NOTES
          {
            printf 'ACTUAL release %s\n\n' "$TAG"
            printf -- '- Commit: `%s`\n' "$EXPECTED_SHA"
            printf -- '- Snapshot: `%s`\n' "$snapshot"
            printf -- '- Release fingerprint: `%s`\n' "$fingerprint"
            printf -- '- Contract: `%s`\n\n' "$contract"
            printf '%s\n' 'Required admission checks were successful on the exact released commit. Evidence was assembled with the digest-pinned ACTUAL runtime, exact Node/npm versions, and network disabled during SBOM generation. Attached assets include the release manifest, source-bundle manifest, review-evidence bundle, CycloneDX SBOM, known limitations, and SHA-256 checksums.'
          } > release-assets/RELEASE-NOTES.md
          # END RELEASE NOTES

      - name: Create draft and upload evidence
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$EXPECTED_SHA" --title "ACTUAL ${TAG#actual-}" --notes-file release-assets/RELEASE-NOTES.md --draft
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY"             release-assets/actual-release-manifest.json             release-assets/actual-source-bundle-manifest.json             release-assets/actual-review-evidence-bundle.json             release-assets/actual-sbom.cdx.json             release-assets/actual-v1-known-limitations.md             release-assets/actual-release-checksums.sha256
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
