name: OSM-ACQ.2c private OSH ingest offline guards
on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2c-bulk-osh.yml'
      - 'scripts/audit/osm_acq2c_bulk_osh.py'
      - 'scripts/audit/test_osm_acq2c_bulk_osh.py'
      - 'docs/evidence/osm-acq2c-bulk-private-ingest-20261022.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-synthetic:
    name: osm-acq2c-bulk-offline-guards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Synthetic provenance and graph closure tests only
        run: python scripts/audit/test_osm_acq2c_bulk_osh.py
      - name: Deterministic frozen corpus plan only (no network)
        run: python scripts/audit/osm_acq2c_bulk_osh.py --plan-only
