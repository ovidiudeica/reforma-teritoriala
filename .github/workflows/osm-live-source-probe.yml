name: OSM candidate source-only live probe

on:
  pull_request:
    paths:
      - 'scripts/import/import-osm.mjs'
      - 'scripts/lib/osm-source-continuity.mjs'
      - 'scripts/process/audit-osm-refresh-continuity.mjs'
      - '.github/workflows/osm-live-source-probe.yml'

permissions:
  contents: read

jobs:
  source-only-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate code; no repository writes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Capture verified current OSM relations (isolated ephemeral runner)
        timeout-minutes: 25
        run: node scripts/import/import-osm.mjs
      - name: Exact per-ID reconciliation against persisted baseline
        run: node scripts/process/audit-osm-refresh-continuity.mjs
      - name: Preserve source-only candidate and per-ID evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osm-source-only-drift-evidence
          path: |
            outputs/osm-source-continuity.json
            data/sources/osm-current.json
          if-no-files-found: warn
          retention-days: 30
