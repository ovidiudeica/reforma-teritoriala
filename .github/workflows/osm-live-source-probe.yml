name: OSM current source reconciliation live probe

# Network-enabled evidence capture for the independently refreshable current OSM source.
# It never promotes or rewrites the protected ACTUAL OSM pin.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/osm-live-source-probe.yml'
      - 'data/sources/osm-source-contract.json'
      - 'data/sources/osm-source-current.json'
      - 'data/sources/osm-source-transition-policy.json'
      - 'data/sources/osm-source-refresh-request.json'
      - 'scripts/import/import-osm.mjs'
      - 'scripts/lib/osm-source-continuity.mjs'
      - 'scripts/lib/osm-source-transition.mjs'
      - 'scripts/process/audit-osm-refresh-continuity.mjs'
      - 'scripts/process/audit-osm-fix2-source-transition.mjs'
      - 'scripts/process/capture-osm-fix2-forensics.mjs'
      - 'scripts/process/stage-osm-current-candidate.mjs'

permissions:
  contents: read

concurrency:
  group: osm-live-source-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ni-outline-source-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Acquire eight official outline sources without semantic acceptance
        run: node scripts/process/capture-ni-outlines-current.mjs
      - name: Prove acquisition is read-only
        run: git diff --exit-code
      - name: Preserve source bytes and real retrieval timestamps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ni-outline-source-acquisition-${{ github.run_id }}
          path: outputs/ni-outline-source-acquisition/
          if-no-files-found: error
          retention-days: 30

  per-id-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without write credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Capture all thirteen relation histories and changesets independently
        run: node scripts/process/capture-osm-fix2-forensics.mjs
      - name: Preserve original per-ID HTTP evidence even if source import is blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osm-per-id-forensics-${{ github.run_id }}
          path: |
            outputs/osm-fix2-per-id-forensics.json
            outputs/osm-fix2-official-api/
          if-no-files-found: error
          retention-days: 30

  closure-forensics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate without write credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Capture independent official per-ID closure evidence
        run: node scripts/process/capture-osm-closure-forensics.mjs
      - name: Preserve original HTTP bodies and receipt hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osm-closure-forensics-${{ github.run_id }}
          path: outputs/osm-closure-forensics/
          if-no-files-found: error
          retention-days: 30

  source-only-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OSM_CURRENT_SOURCE_MANIFEST: data/sources/osm-source-current.json
      OSM_ACTUAL_PIN_MANIFEST: data/sources/osm-current.json
    steps:
      - name: Checkout exact candidate code; no repository writes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prove protected ACTUAL payload is untouched by this PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" --             data/sources/osm-current.json             data/current             public/data/actual-entities.json             public/data/actual-geometry-chunks.json             public/geo/current             public/geo/actual

      - name: Capture verified current OSM source
        timeout-minutes: 25
        env:
          OSM_MANIFEST_PATH: ${{ env.OSM_CURRENT_SOURCE_MANIFEST }}
        run: node scripts/import/import-osm.mjs

      - name: Build exact per-ID drift report against protected ACTUAL pin
        env:
          OSM_CONTINUITY_BASELINE_MANIFEST: ${{ env.OSM_ACTUAL_PIN_MANIFEST }}
          OSM_CONTINUITY_REPORT_ONLY: '1'
        run: node scripts/process/audit-osm-refresh-continuity.mjs

      - name: Capture authoritative relation histories, CUATM context and changesets
        run: node scripts/process/capture-osm-fix2-forensics.mjs

      - name: Gate the explicitly approved source-only transition
        run: node scripts/process/audit-osm-fix2-source-transition.mjs

      - name: Stage exact candidate bytes and evidence
        if: always()
        run: node scripts/process/stage-osm-current-candidate.mjs

      - name: Preserve exact source candidate and OSM-FIX.2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osm-fix2-source-candidate-${{ github.run_id }}
          path: outputs/osm-source-candidate/
          if-no-files-found: error
          retention-days: 30
