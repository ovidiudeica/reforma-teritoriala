name: Temporary rebind ACTUAL build environment

on:
  pull_request:
    paths:
      - '.github/workflows/rebind-actual-build-environment.yml'

permissions:
  contents: write

jobs:
  rebind:
    if: github.head_ref == 'fix/osm-refresh-control-home'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Rebuild exact ACTUAL build-environment manifest
        run: node scripts/process/build-actual-build-environment-manifest.mjs

      - name: Commit rebound manifest
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/actual-build-environment-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Rebind ACTUAL build environment after refresh fix"
          git push origin "HEAD:$HEAD_BRANCH"
