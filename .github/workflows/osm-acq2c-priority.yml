name: OSM-ACQ.2c bounded historical dependency pilot

on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2c-priority.yml'
      - 'scripts/audit/osm_acq2c_priority.py'
      - 'scripts/audit/test_osm_acq2c_priority.py'
      - 'docs/evidence/osm-acq2a-incremental-20261022/registry.json.gz'
      - 'docs/evidence/osm-acq2c-priority-pilot-20261022/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Ten epoch-history validation tests
        run: python scripts/audit/test_osm_acq2c_priority.py
      - name: Plan deduplicated targets from pinned evidence
        run: python scripts/audit/osm_acq2c_priority.py --plan-only
      - name: Read-only bounded official OSM history capture
        run: python scripts/audit/osm_acq2c_priority.py
      - name: Preserve raw XML and SHA-256 receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osm-acq2c-historical-originals
          path: outputs/osm-acq2c-priority-run/
          if-no-files-found: error
          retention-days: 30
