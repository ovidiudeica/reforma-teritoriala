name: RT-ADM.2.2 targeted CUATM and OSM evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit/rt-adm2-2-acquire.py'
      - '.github/workflows/rt-adm2-2-evidence.yml'
      - 'docs/audits/rt-adm2-2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'openpyxl==3.1.5'
      - run: python scripts/audit/rt-adm2-2-acquire.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rt-adm2-2-targeted-primary-evidence
          path: outputs/RT-ADM.2.2/
          if-no-files-found: error
          retention-days: 90
      - run: git diff --exit-code
