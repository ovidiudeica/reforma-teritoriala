name: Monitor ACTUAL source freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Audit source freshness
        run: node scripts/process/audit-actual-source-freshness.mjs
      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actual-source-freshness
          path: actual-source-freshness.json
          if-no-files-found: error
          retention-days: 14
