name: P9.0.5 independent A/B qualification of exact 20261101.114.1
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/p905-20261101-1141-independent-ab.yml'
      - 'scripts/audit/p905-20261101-1141-independent-ab.mjs'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Capture independently observed runner, kernel, Docker and CPU
        env:
          QUALIFICATION_LANE: ${{ matrix.lane }}
        run: node scripts/audit/p905-20261101-1141-independent-ab.mjs capture
      - name: Enforce read-only audit
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p905-20261101-1141-${{ matrix.lane }}
          path: outputs/p905-20261101-1141/${{ matrix.lane }}.json
          if-no-files-found: error
  compare:
    needs: observe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p905-20261101-1141-A
          path: outputs/p905-20261101-1141/A
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p905-20261101-1141-B
          path: outputs/p905-20261101-1141/B
      - name: Compare independent A/B, fail closed on image/kernel/stack or CPU drift
        run: node scripts/audit/p905-20261101-1141-independent-ab.mjs compare
      - name: Verify protected bytes not altered
        run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: p905-20261101-1141-ab-comparison
          path: outputs/p905-20261101-1141/comparison.json
          if-no-files-found: error
