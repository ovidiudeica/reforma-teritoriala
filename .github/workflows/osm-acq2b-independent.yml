name: OSM-ACQ.2b independent geometric and evidence gate

on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2b-independent.yml'
      - 'docs/evidence/osm-acq2a-incremental-20261022/**'
      - 'docs/evidence/osm-acq2b-*/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned geometry oracle
        run: python -m pip install --no-cache-dir 'shapely==2.1.2'
      - name: Differential geometry, exact rational and adversarial tests
        run: python docs/evidence/osm-acq2b-independent-20261022/test_exact_geometry_independent.py
      - name: Negative integrity controls
        run: python docs/evidence/osm-acq2b-independent-20261022/verify_evidence.py --self-test
      - name: Verify manifests, combined registries and lineage
        run: python docs/evidence/osm-acq2b-independent-20261022/verify_evidence.py
