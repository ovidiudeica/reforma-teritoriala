name: ACTUAL topology audit

on:
  pull_request:
    paths:
      - 'public/geo/current/**'
      - 'data/current/entities.json'
      - 'scripts/process/audit-actual-topology.mjs'
      - 'scripts/process/audit-actual-release-gate.mjs'
      - 'scripts/process/build-actual-release-manifest.mjs'
      - 'scripts/process/audit-actual-structural-completeness.mjs'
      - 'scripts/process/audit-actual-official-identity.mjs'
      - 'scripts/process/apply-ro-official-reconciliation.mjs'
      - 'scripts/process/audit-ro-county-siruta-bridge.mjs'
      - 'scripts/process/audit-md-cuatm-semantic-bridge.mjs'
      - 'scripts/process/apply-md-reviewed-reconciliation.mjs'
      - 'data/sources/md-cuatm-reviewed-overrides.json'
      - 'data/sources/md-cuatm-individual-review.json'
      - 'data/sources/md-cuatm-semantic-policy.json'
      - 'data/sources/actual-settlement-policy.json'
      - 'scripts/process/build-actual-public-data.mjs'
      - 'scripts/process/audit-osm-relation-12463200.mjs'
      - 'scripts/import/import-osm.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/actual-topology-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Check import script syntax
        run: node --check scripts/import/import-osm.mjs
      - run: npm run audit:osm-12463200
      - name: Regenerate OSM ACTUAL master
        run: npm run import:osm
      - name: Verify regenerated topology
        run: npm run audit:actual-topology
      - name: Audit RO+MD statistical levels and state polygons
        run: npm run audit:actual-statistical-levels
      - name: Reconcile RO against official SIRUTA
        run: npm run audit:ro-official-reconciliation
      - name: Audit RO reconciliation exceptions
        run: npm run audit:ro-official-exceptions
      - name: Audit RO county SIRUTA bridge
        run: npm run audit:ro-county-siruta-bridge
      - name: Apply RO official identity
        run: npm run apply:ro-official-reconciliation
      - name: Reconcile MD against official CUATM
        run: npm run reconcile:cuatm
      - name: Audit MD CUATM semantic subtype bridge
        run: npm run audit:md-cuatm-semantic-bridge
      - name: Apply reviewed MD official identity
        run: npm run apply:md-reviewed-reconciliation
      - name: Regenerate public ACTUAL contract
        run: npm run build:actual-public-data
      - name: Audit Chișinău sector identity propagation
        run: npm run audit:md-chisinau-sectors
      - name: Audit structural completeness
        run: npm run audit:actual-structural-completeness
      - name: Audit official identity propagation for all ACTUAL entities
        run: npm run audit:actual-official-identity
      - run: npm run audit:actual-release-gate
      - name: Upload topology report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-topology-audit
          path: |
            data/current/actual-topology-audit.json
            data/current/osm-12463200-audit.json
            data/current/ro-county-siruta-bridge.json
            data/current/ro-official-application.json
            data/current/md-cuatm-semantic-bridge.json
            data/current/md-reviewed-official-application.json
            data/current/actual-structural-completeness-audit.json
            data/current/actual-official-identity-audit.json
            data/sources/actual-settlement-policy.json
          if-no-files-found: error


