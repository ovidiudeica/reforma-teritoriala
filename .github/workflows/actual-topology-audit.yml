name: ACTUAL topology audit

on:
  pull_request:
    paths:
      - 'public/geo/current/**'
      - 'data/current/entities.json'
      - 'data/current/actual-release-manifest.json'
      - 'data/current/actual-release-persisted.json'
      - 'scripts/process/audit-actual-topology.mjs'
      - 'scripts/process/audit-actual-release-gate.mjs'
      - 'scripts/import/import-osm.mjs'
      - 'scripts/process/build-osm-actual.mjs'
      - 'data/sources/osm-current.json'
      - 'data/sources/osm-snapshots/**'
      - 'scripts/test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/actual-topology-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out requested revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'

      - name: Audit pinned ACTUAL execution environment
        env:
          ACTUAL_BUILD_ENVIRONMENT_GATE_READ_ONLY: '1'
        run: npm run audit:actual-build-environment

      - name: Audit pinned Node/npm toolchain
        run: npm run audit:node-toolchain

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Require persisted ACTUAL release
        run: |
          test -f data/current/actual-release-persisted.json
          test -f data/current/actual-release-manifest.json

      - name: Verify persisted release bytes read-only
        env:
          ACTUAL_RELEASE_GATE_READ_ONLY: '1'
        run: npm run audit:actual-release-gate

      - name: Check separated OSM source/build syntax
        run: |
          node --check scripts/import/import-osm.mjs
          node --check scripts/process/build-osm-actual.mjs

      - name: Audit committed ACTUAL topology
        run: npm run audit:actual-topology

      - name: Upload topology report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actual-topology-audit
          path: data/current/actual-topology-audit.json
          if-no-files-found: error

      - name: Prove topology audit is repository read-only
        run: |
          git restore --source=HEAD -- data/current/actual-topology-audit.json
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Topology audit changed tracked repository files:"
            git status --short --untracked-files=no
            git diff -- .
            exit 1
          fi
