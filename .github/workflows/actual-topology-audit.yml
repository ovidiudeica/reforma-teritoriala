name: ACTUAL topology audit

on:
  pull_request:
    paths:
      - 'public/geo/current/**'
      - 'data/current/entities.json'
      - 'scripts/process/audit-actual-topology.mjs'
      - 'scripts/process/audit-actual-release-gate.mjs'
      - 'scripts/process/audit-osm-relation-12463200.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/actual-topology-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run audit:osm-12463200
      - run: npm run audit:actual-release-gate
      - name: Upload topology report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-topology-audit
          path: |
            data/current/actual-topology-audit.json
            data/current/osm-12463200-audit.json
          if-no-files-found: error
