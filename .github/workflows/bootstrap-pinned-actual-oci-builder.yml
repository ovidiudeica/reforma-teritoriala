name: Bootstrap pinned ACTUAL OCI builder provenance

on:
  push:
    branches:
      - actual/pin-buildx-buildkit

permissions:
  contents: write
  packages: read

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ovidiudeica/reforma-teritoriala-actual-runtime@sha256:f42f3147dade3cdc7cc0765a70e4549a882015e81194ae242e709fc7aa0a0f40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      EXPECTED_MAIN_SHA: b9b29faf3d6d842c95bfb644504e95695e559b09
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: actual/pin-buildx-buildkit
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Freeze provenance base
        id: base
        run: |
          git fetch origin main
          BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          test "$BASE_SHA" = "$EXPECTED_MAIN_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and gate OCI builder provenance
        run: |
          npm run build:actual-oci-builder
          npm run audit:actual-oci-builder

      - name: Rebuild runtime provenance v2
        run: |
          npm run build:actual-runtime-image-manifest
          npm run audit:actual-runtime-image

      - name: Rebuild exact build environment
        run: |
          npm run build:actual-build-environment
          npm run audit:actual-build-environment

      - name: Rebind unchanged semantic release
        env:
          ACTUAL_BASE_REF: ${{ steps.base.outputs.base_sha }}
        run: |
          npm run build:actual-release-manifest
          npm run audit:actual-release-gate

      - name: Rebind persisted marker
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const manifestBytes=await readFile('data/current/actual-release-manifest.json');
          const manifest=JSON.parse(manifestBytes);
          const previous=JSON.parse(execFileSync('git',['show',process.env.EXPECTED_MAIN_SHA+':data/current/actual-release-persisted.json'],{encoding:'utf8'}));
          const manifestSha=createHash('sha256').update(manifestBytes).digest('hex');
          const marker={
            schema_version:1,
            snapshot_id:manifest.snapshot_id,
            release_fingerprint_sha256:manifest.release_fingerprint_sha256,
            manifest_sha256:manifestSha,
            source_bundle_fingerprint_sha256:manifest.source_bundle?.bundle_fingerprint_sha256??null,
            review_evidence_bundle_fingerprint_sha256:manifest.review_evidence_bundle?.bundle_fingerprint_sha256??null,
            network_denial_sha256:manifest.network_denial?.sha256??null,
            host_trust_fingerprint_sha256:manifest.host_trust?.host_trust_fingerprint_sha256??null,
            build_environment_fingerprint_sha256:manifest.build_environment?.environment_fingerprint_sha256??null,
            validated_release_gate_status:'PASS',
            provenance_migration:{
              previous_manifest_sha256:previous.manifest_sha256,
              reason:'pinned-buildx-buildkit'
            },
            policy:'Marker for exact ACTUAL snapshot bytes and pinned OCI-builder provenance. Runtime construction is bound to byte-pinned Buildx and digest-pinned BuildKit.'
          };
          await writeFile('data/current/actual-release-persisted.json',JSON.stringify(marker,null,2)+'\n');
          NODE

      - name: Remove bootstrap workflow and commit provenance
        run: |
          git rm .github/workflows/bootstrap-pinned-actual-oci-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/current/actual-oci-builder.json             data/current/actual-oci-builder-gate.json             data/current/actual-runtime-image.json             data/current/actual-build-environment-manifest.json             data/current/actual-build-environment-gate.json             data/current/actual-release-manifest.json             data/current/actual-release-gate.json             data/current/actual-release-persisted.json
          git commit -m "Bootstrap pinned ACTUAL OCI builder provenance"
          git push origin HEAD:actual/pin-buildx-buildkit
