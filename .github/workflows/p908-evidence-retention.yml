name: P9.0.8 evidence preservation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preservation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - run: node scripts/audit/p908-legacy-evidence-retention.mjs --self-test
      - run: node scripts/audit/p908-legacy-evidence-retention.mjs --audit
      - run: git diff --exit-code
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p908-evidence-verdict
          path: outputs/P9.0.8/evidence-verdict.json
          if-no-files-found: warn
