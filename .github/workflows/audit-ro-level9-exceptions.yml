name: Audit RO level 9 exceptions
on:
  push:
    branches:
      - audit/ro-five-exceptions
    paths:
      - scripts/process/audit-ro-level9-exceptions.mjs
      - data/sources/ro-level9-exception-evidence.json
      - .github/workflows/audit-ro-level9-exceptions.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install
      - name: Audit five RO level 9 exceptions
        run: node scripts/process/audit-ro-level9-exceptions.mjs
      - name: Commit audit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/ro-level9-exception-audit.json data/sources/ro-osm-level9-exception-history.json
          git diff --cached --quiet || git commit -m "data: audit RO level 9 exceptions"
          git push origin HEAD:audit/ro-five-exceptions
