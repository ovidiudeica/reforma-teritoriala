name: Promote ACTUAL candidate

on:
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: 'Candidate branch created by Build ACTUAL candidate snapshot'
        required: true
        type: string
      expected_candidate_snapshot:
        description: 'Exact candidate snapshot id, e.g. actual-0123456789abcdef'
        required: true
        type: string
      confirmation:
        description: 'Type PROMOTE <snapshot_id>'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: actual-candidate-promotion
  cancel-in-progress: false

jobs:
  prepare-promotion:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ovidiudeica/reforma-teritoriala-actual-runtime@sha256:67fd65aa8fba6bb2555741a485f06149793d24c67424d373eae4db818850a95a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate promotion write-boundary inputs
        env:
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
          EXPECTED_CANDIDATE_SNAPSHOT: ${{ inputs.expected_candidate_snapshot }}
          CONFIRM_PROMOTION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CANDIDATE_BRANCH" | grep -Eq '^actual/candidate-[a-z0-9][a-z0-9._-]{0,95}$'; then
            echo "Promotion branch must be an ACTUAL candidate branch."
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_CANDIDATE_SNAPSHOT" | grep -Eq '^actual-[0-9a-f]{16}$'; then
            echo "Candidate snapshot must match actual-<16 lowercase hex>."
            exit 1
          fi
          if [ "$CONFIRM_PROMOTION" != "PROMOTE $EXPECTED_CANDIDATE_SNAPSHOT" ]; then
            echo "Promotion confirmation does not match the exact snapshot."
            exit 1
          fi

      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_branch }}
          fetch-depth: 0

      - name: Trust mounted GitHub workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Gate pinned ACTUAL OCI runtime
        run: npm run audit:actual-runtime-image

      - name: Audit vendored npm dependency bundle
        run: npm run audit:actual-npm-dependency-bundle

      - name: Audit pinned ACTUAL execution environment
        env:
          ACTUAL_BUILD_ENVIRONMENT_GATE_READ_ONLY: '1'
        run: npm run audit:actual-build-environment

      - name: Audit pinned Node/npm toolchain
        run: npm run audit:node-toolchain

      - name: Capture exact candidate and current main commits
        id: current_main
        env:
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$CANDIDATE_BRANCH:refs/remotes/origin/$CANDIDATE_BRANCH"
          CANDIDATE_COMMIT_SHA="$(git rev-parse HEAD)"
          REMOTE_CANDIDATE_SHA="$(git rev-parse "refs/remotes/origin/$CANDIDATE_BRANCH")"
          if [ "$CANDIDATE_COMMIT_SHA" != "$REMOTE_CANDIDATE_SHA" ]; then
            echo "Checked-out candidate does not match the exact remote branch head."
            exit 1
          fi
          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if ! printf '%s' "$CURRENT_MAIN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Current main did not resolve to an exact commit SHA: $CURRENT_MAIN_SHA"
            exit 1
          fi
          CANDIDATE_BASE_SHA="$(node -p "require('./data/current/actual-release-candidate.json').base_ref")"
          if ! printf '%s' "$CANDIDATE_BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Candidate marker does not bind an exact base commit SHA: $CANDIDATE_BASE_SHA"
            exit 1
          fi
          if [ "$CURRENT_MAIN_SHA" != "$CANDIDATE_BASE_SHA" ]; then
            echo "Persisted base moved: candidate=$CANDIDATE_BASE_SHA current_main=$CURRENT_MAIN_SHA"
            exit 1
          fi
          if [ "$(git rev-parse "$CANDIDATE_COMMIT_SHA^")" != "$CURRENT_MAIN_SHA" ]; then
            echo "Candidate commit is not a direct child of the exact persisted base."
            exit 1
          fi
          if [ "$(git rev-list --count "$CURRENT_MAIN_SHA..$CANDIDATE_COMMIT_SHA")" != "1" ]; then
            echo "Candidate branch must contain exactly one candidate commit over the persisted base."
            exit 1
          fi
          BAD_PATHS="$(git diff --name-only "$CURRENT_MAIN_SHA..$CANDIDATE_COMMIT_SHA" | grep -Ev '^(data/current/|public/data/actual-entities\.json$|public/geo/current/|public/geo/actual/|data/sources/ro-siruta-current\.json$|data/sources/cuatm-current\.json$|data/sources/osm-current\.json$|data/sources/osm-snapshots/|data/sources/ro-osm-official-exception-history\.json$|data/sources/ro-osm-level9-exception-history\.json$|data/sources/md-osm-multiple-representation-history\.json$|data/sources/md-balti-city-boundary-way-history\.json$|data/sources/md-balti-city-boundary-changeset-semantics\.json$)' || true)"
          if [ -n "$BAD_PATHS" ]; then
            echo "Candidate branch contains files outside the ACTUAL write boundary:"
            printf '%s\n' "$BAD_PATHS"
            exit 1
          fi
          CANDIDATE_TREE_SHA="$(git rev-parse "$CANDIDATE_COMMIT_SHA^{tree}")"
          echo "current_main_sha=$CURRENT_MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_commit_sha=$CANDIDATE_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_tree_sha=$CANDIDATE_TREE_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate candidate bytes
        env:
          ACTUAL_RELEASE_GATE_READ_ONLY: '1'
        run: node scripts/process/audit-actual-release-gate.mjs

      - name: Prepare explicit promotion marker
        env:
          ACTUAL_BASE_REF: ${{ steps.current_main.outputs.current_main_sha }}
          ACTUAL_CANDIDATE_COMMIT_SHA: ${{ steps.current_main.outputs.candidate_commit_sha }}
          ACTUAL_CANDIDATE_TREE_SHA: ${{ steps.current_main.outputs.candidate_tree_sha }}
          EXPECTED_CANDIDATE_SNAPSHOT: ${{ inputs.expected_candidate_snapshot }}
          CONFIRM_PROMOTION: ${{ inputs.confirmation }}
        run: npm run prepare:actual-candidate-promotion

      - name: Verify promoted marker matches exact candidate
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';
          const marker=JSON.parse(await readFile('data/current/actual-release-persisted.json','utf8'));
          const manifestBytes=await readFile('data/current/actual-release-manifest.json');
          const manifest=JSON.parse(manifestBytes);
          const sha=createHash('sha256').update(manifestBytes).digest('hex');
          if(marker.snapshot_id!==manifest.snapshot_id||marker.release_fingerprint_sha256!==manifest.release_fingerprint_sha256||marker.manifest_sha256!==sha||marker.review_evidence_bundle_fingerprint_sha256!==manifest.review_evidence_bundle?.bundle_fingerprint_sha256||marker.network_denial_sha256!==manifest.network_denial?.sha256||marker.host_trust_fingerprint_sha256!==manifest.host_trust?.host_trust_fingerprint_sha256||marker.validated_release_gate_status!=='PASS'){
            throw new Error('Promotion marker does not bind the exact candidate snapshot.');
          }
          console.log(JSON.stringify({status:'PASS',snapshot_id:marker.snapshot_id,manifest_sha256:sha},null,2));
          NODE

      - name: Commit promotion marker on candidate branch
        env:
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
          EXPECTED_CANDIDATE_SNAPSHOT: ${{ inputs.expected_candidate_snapshot }}
          CANDIDATE_COMMIT_SHA: ${{ steps.current_main.outputs.candidate_commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/actual-release-persisted.json data/current/actual-candidate-promotion-audit.json
          COMMIT_DATE="$(node -p "require('./data/current/actual-release-manifest.json').generated_at")"
          GIT_AUTHOR_DATE="$COMMIT_DATE" GIT_COMMITTER_DATE="$COMMIT_DATE" git commit -m "Prepare ACTUAL promotion $EXPECTED_CANDIDATE_SNAPSHOT"
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_COMMIT_SHA"
          PROMOTION_PATHS="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          EXPECTED_PATHS="$(printf '%s\n' data/current/actual-candidate-promotion-audit.json data/current/actual-release-persisted.json | sort)"
          if [ "$PROMOTION_PATHS" != "$EXPECTED_PATHS" ]; then
            echo "Promotion commit crossed its two-file write boundary:"
            printf '%s\n' "$PROMOTION_PATHS"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

      - name: Open promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
          SNAPSHOT_ID: ${{ inputs.expected_candidate_snapshot }}
        run: |
          EXISTING="$(gh pr list --base main --head "$CANDIDATE_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$EXISTING" ]; then
            EXISTING_HEAD="$(gh pr view "$EXISTING" --json headRefOid --jq '.headRefOid')"
            test "$EXISTING_HEAD" = "$(git rev-parse HEAD)"
            echo "Promotion PR already exists at the exact promotion commit: $EXISTING"
            echo "### Promotion PR" >> "$GITHUB_STEP_SUMMARY"
            echo "$EXISTING" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BASE_SNAPSHOT="$(node -p "require('./data/current/actual-release-candidate.json').base_release.snapshot_id")"
          REVIEW_REQUIRED="$(node -p "require('./data/current/actual-release-candidate.json').review_required")"
          CHANGE_COUNT="$(node -p "require('./data/current/actual-release-candidate.json').substantive_change_count")"
          BODY="Explicit ACTUAL candidate promotion. Candidate: $SNAPSHOT_ID. Base persisted release: $BASE_SNAPSHOT. Substantive diff count: $CHANGE_COUNT. Candidate review_required: $REVIEW_REQUIRED. The candidate release gate passed before this PR was created. The required verify-persisted-release check must pass on the promotion PR before merge."
          URL="$(gh pr create --base main --head "$CANDIDATE_BRANCH" --title "Promote ACTUAL candidate $SNAPSHOT_ID" --body "$BODY")"
          echo "### Promotion PR" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
