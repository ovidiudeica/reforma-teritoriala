name: Refresh official Romania SIRUTA snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 2 * *'

permissions:
  contents: write
  packages: read

concurrency:
  group: ro-siruta-source-refresh
  cancel-in-progress: false

jobs:
  refresh-through-candidate:
    uses: ./.github/workflows/actual-candidate.yml
    with:
      base_release_commit: ${{ github.sha }}
      candidate_branch: ''
      refresh_ro_siruta: true
      refresh_md_cuatm: false
      refresh_osm: false
      source_trigger: 'ro-siruta-refresh'
