name: WEB-R2c.4 published website acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BROWSER_EXECUTABLE: /usr/bin/google-chrome
      ATLAS_HARDENING_MODE: published
      ATLAS_PUBLISHED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact published PR baseline
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: published-baseline
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Provenance and resource failure regressions
        run: |
          google-chrome --version
          node --check scripts/audit/web-r2c32-hardening-browser.mjs
          node --test scripts/test/frontend-published-source.test.mjs scripts/test/frontend-published-runtime.test.mjs scripts/test/published-runtime-retry.test.mjs
          node --test scripts/test/frontend-navigation-failure-evidence.test.mjs scripts/test/frontend-performance-navigation.test.mjs
      - name: Published runtime inventory and Chromium matrix
        run: node scripts/audit/web-r2c32-hardening-browser.mjs
      - name: Verify preserved navigation failure evidence
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('docs/evidence/navigation-failure-20261023')
          manifest=json.loads((root/'manifest-sha256.json').read_bytes())
          seen=set()
          for row in manifest['files']:
              name=row['name']
              assert pathlib.Path(name).name==name and name not in seen
              seen.add(name)
              raw=(root/name).read_bytes()
              assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
          assert seen=={p.name for p in root.iterdir() if p.is_file() and p.name!='manifest-sha256.json'}
          result=json.loads((root/'local-tests.json').read_bytes())
          reviewed={'scripts/audit/helpers/performance-navigation.mjs','scripts/audit/web-r2c32-hardening-browser.mjs','scripts/test/helpers/atlas-browser.mjs','scripts/test/helpers/navigation-evidence.mjs','scripts/test/frontend-navigation-failure-evidence.test.mjs'}
          assert set(result['code_sha256'])==reviewed
          for name in reviewed:
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==result['code_sha256'][name]
          PY
      - name: Exact source admission
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; import {execFileSync} from 'node:child_process'; const r=JSON.parse(fs.readFileSync('outputs/web-r2c4-published/report.json')); assert.equal(r.status,'PASS'); assert.equal(r.trackedSourcesClean,true); assert.equal(r.sourceSha,execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()); assert.equal(r.mode,'published'); assert.equal(r.publishedInventory.status,'PASS'); assert.equal(r.publishedInventory.checkedFiles,r.publishedInventory.expectedFiles); const pr=process.env.GITHUB_EVENT_NAME==='pull_request'; assert.equal(r.coverage,pr?'PR_PUBLISHED_BASELINE_ONLY':'PUBLISHED_EXACT_CHECKOUT'); assert.equal(r.expectedPublishedSha,pr?process.env.ATLAS_PUBLISHED_BASE_SHA:r.sourceSha);"
          git diff --exit-code
      - name: Preserve runtime hashes, raw diagnostics and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-r2c4-published-evidence
          path: outputs/web-r2c4-published
          retention-days: 30
