name: RT-ADM.2.12 consolidated version evidence guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/rt-adm2-12/**'
      - 'scripts/audit/rt-adm2-12-verify.mjs'
      - '.github/workflows/rt-adm2-12.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node scripts/audit/rt-adm2-12-verify.mjs
      - run: git diff --exit-code
