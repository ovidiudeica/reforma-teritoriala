name: RT-ADM.2.11 post-1979 legal corpus guard
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/rt-adm2-11/**'
      - 'scripts/audit/rt-adm2-11-verify.mjs'
      - '.github/workflows/rt-adm2-11.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - run: node scripts/audit/rt-adm2-11-verify.mjs
      - run: git diff --exit-code
