name: RT-ADM.2.4 official cadastral WFS acquisition
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit/rt-adm2-4-cadastral-wfs.py'
      - '.github/workflows/rt-adm2-4-cadastral.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-wfs-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/audit/rt-adm2-4-cadastral-wfs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rt-adm2-4-official-cadastral-evidence
          path: outputs/RT-ADM.2.4/
          if-no-files-found: error
          retention-days: 90
      - run: git diff --exit-code
