name: RT-AUDIT.1 parent-child evidence
on:
  push:
    branches:
      - audit/rt-audit-1-parent-child-20261028
    paths:
      - scripts/audit/rt-audit1-parent-child.mjs
      - .github/workflows/rt-audit-1.yml
      - docs/rt-audit-1/**
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and produce read-only evidence
        run: |
          node --version
          node scripts/audit/rt-audit1-parent-child.mjs --write
          node scripts/audit/rt-audit1-parent-child.mjs --check
      - name: Ensure ACTUAL and application inputs unchanged
        run: |
          git diff --exit-code -- data/current public/geo public/data/actual-entities.json public/data/actual-consolidated-tree.json public/data/actual-topology-index.json public/data/topology public/data/topology-frontiers
      - name: Commit derived audit outputs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rt-audit-1/
          if ! git diff --cached --quiet; then
            git commit -m "audit: publish RT-AUDIT.1 5846-row evidence"
            git push origin HEAD:audit/rt-audit-1-parent-child-20261028
          fi
