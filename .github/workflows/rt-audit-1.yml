name: RT-AUDIT.1 parent-child evidence
on:
  pull_request:
    branches: [main]
  push:
    branches: [audit/rt-audit-1-parent-child-20261028]
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate independent read-only audit
        run: |
          node --version
          node scripts/audit/rt-audit1-parent-child.mjs --write
          node scripts/audit/rt-audit1-parent-child.mjs --check
      - name: Ensure no source file changed
        run: |
          git diff --exit-code -- data/current public/geo public/data/actual-entities.json public/data/actual-consolidated-tree.json public/data/actual-topology-index.json public/data/topology public/data/topology-frontiers
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: rt-audit-1-parent-child-register
          path: docs/rt-audit-1/
          if-no-files-found: error
