name: RT-ADM.2.13.1 exact topology evidence
on:
  push:
    branches:
      - audit/rt-adm-2-13-1-exact-topology
    paths:
      - scripts/audit/rt-adm2-13-1-exact-topology.py
      - .github/workflows/rt-adm2-13-1-exact-topology.yml
permissions:
  contents: read
jobs:
  exact-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned geometry dependencies
        run: python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Exact municipal sector audit
        run: python scripts/audit/rt-adm2-13-1-exact-topology.py
      - name: Preserve diagnostic evidence as runner output
        if: always()
        run: |
          if [ -f docs/audits/rt-adm2-13-1/topology-register.json ]; then
            cat docs/audits/rt-adm2-13-1/topology-register.json
            cat docs/audits/rt-adm2-13-1/artifact-receipt.json
          else
            echo "RT-ADM.2.13.1: no validated topology register generated"
          fi
