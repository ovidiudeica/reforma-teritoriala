name: RT-ADM.2.13.1 exact topology evidence
on:
  push:
    branches:
      - audit/rt-adm-2-13-1-exact-topology
    paths:
      - scripts/audit/rt-adm2-13-1-verify-osmb.py
      - scripts/audit/rt-adm2-13-1-exact-topology.py
      - .github/workflows/rt-adm2-13-1-exact-topology.yml
      - docs/audits/rt-adm2-13-1/**
      - docs/audits/rt-adm2-13-1/**
permissions:
  contents: read
jobs:
  exact-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned geometry dependencies
        run: python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Reproduce OSMB report with canonical seven-feature input
        run: python scripts/audit/rt-adm2-13-1-verify-osmb.py
