name: RT-ADM.2.13.1 exact topology evidence
on:
  push:
    branches:
      - audit/rt-adm-2-13-1-exact-topology
    paths:
      - scripts/audit/rt-adm2-13-1-exact-topology.py
      - .github/workflows/rt-adm2-13-1-exact-topology.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned geometry dependencies
        run: python -m pip install 'shapely==2.1.2' 'pyproj==3.7.2'
      - name: Exact municipal sector audit
        run: python scripts/audit/rt-adm2-13-1-exact-topology.py
      - name: Publish immutable evidence in audit branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/audits/rt-adm2-13-1/topology-register.json docs/audits/rt-adm2-13-1/anomalies-epsg3844.geojson docs/audits/rt-adm2-13-1/artifact-receipt.json
          git diff --cached --quiet || (git commit -m "audit: publish RT-ADM.2.13.1 computed topology evidence" && git push origin HEAD:audit/rt-adm-2-13-1-exact-topology)
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-adm2-13-1-topology
          path: docs/audits/rt-adm2-13-1/
          if-no-files-found: warn
