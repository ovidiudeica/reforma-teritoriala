name: OSM-ACQ.2c selected epoch replay offline validation
on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2c-selected-epoch.yml'
      - 'scripts/audit/osm_acq2c_selected_epoch_*.py'
      - 'scripts/audit/test_osm_acq2c_selected_epoch_*.py'
      - 'scripts/audit/test_osm_acq2c_evidence_paths.py'
      - 'scripts/audit/osm_acq2c_replication_chain.py'
      - 'scripts/audit/osm_acq2c_bulk_preflight.py'
      - 'scripts/audit/osm_acq2c_full_batch.py'
      - 'scripts/audit/osm_acq2c_priority.py'
      - 'docs/evidence/osm-acq2c-selected-epoch-20261023/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Exact epoch, overlap, deletion and negative manifest tests
        run: |
          python scripts/audit/test_osm_acq2c_selected_epoch_core.py
          python scripts/audit/test_osm_acq2c_selected_epoch_store.py
          python scripts/audit/test_osm_acq2c_selected_epoch_loader.py
          python scripts/audit/test_osm_acq2c_evidence_paths.py
      - name: Verify complete public evidence manifest
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('docs/evidence/osm-acq2c-selected-epoch-20261023')
          manifest=json.loads((root/'manifest-sha256.json').read_bytes())
          seen=set()
          for row in manifest['files']:
              name=row['name']
              assert name not in ('.','..') and pathlib.Path(name).name==name and name not in seen
              seen.add(name)
              raw=(root/name).read_bytes()
              assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
          assert seen=={p.name for p in root.iterdir() if p.is_file() and p.name!='manifest-sha256.json'}
          report=json.loads((root/'replay-report.json').read_bytes())
          assert report['source_qualified'] is False and report['geometry_validated'] is False
          assert report['unknown_adjudicated']==0 and report['overpass_equivalence_certified'] is False
          PY
