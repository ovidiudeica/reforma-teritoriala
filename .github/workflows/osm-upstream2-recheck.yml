name: OSM-UPSTREAM.2 read-only Horesti and Buneti verification
on:
  pull_request:
    paths:
      - '.github/workflows/osm-upstream2-recheck.yml'
      - 'scripts/audit/osm_upstream2_recheck.py'
      - 'scripts/audit/test_osm_upstream2_recheck.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-readonly:
    name: osm-upstream2-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Eight negative and status tests
        run: python scripts/audit/test_osm_upstream2_recheck.py
      - name: Recheck live official OSM read-only versions and node identities
        run: python scripts/audit/osm_upstream2_recheck.py
      - name: Archive complete original XML and SHA-256 even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osm-upstream2-immutable-recheck
          path: outputs/osm-upstream2-readonly/
          if-no-files-found: error
          retention-days: 30
