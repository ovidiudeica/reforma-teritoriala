name: WEB-R2c.3.0.2 Chromium CDP read-only performance
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit/web-r2c302-cdp-browser.mjs
      - scripts/audit/helpers/performance-navigation.mjs
      - scripts/audit/helpers/performance-source.mjs
      - scripts/audit/helpers/performance-output.mjs
      - scripts/test/frontend-performance-navigation.test.mjs
      - scripts/test/helpers/atlas-browser.mjs
      - .github/workflows/web-r2c302-cdp-performance.yml
  push:
    branches: [audit/web-r2c3-0-performance-readonly]
    paths:
      - scripts/audit/web-r2c302-cdp-browser.mjs
      - .github/workflows/web-r2c302-cdp-performance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-cdp-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BROWSER_EXECUTABLE: /usr/bin/google-chrome
      ATLAS_PERF_OUTPUT: outputs/web-r2c302-cdp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Baseline source and Chrome provenance
        run: |
          git rev-parse HEAD
          git status --porcelain
          google-chrome --version
          node --check scripts/audit/web-r2c302-cdp-browser.mjs
          node --test scripts/test/frontend-performance-navigation.test.mjs
      - name: Read-only Chromium/CDP performance matrix
        run: node scripts/audit/web-r2c302-cdp-browser.mjs
      - name: Verify report provenance matches the tested commit
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; import {execFileSync} from 'node:child_process'; const report=JSON.parse(fs.readFileSync(process.env.ATLAS_PERF_OUTPUT+'/report.json')); assert.equal(report.sourceMain,execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()); assert.equal(report.status,'PASS');"
      - name: No tracked data or source mutation
        if: always()
        run: git diff --exit-code
      - name: Upload CDP raw metrics and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-r2c302-chromium-cdp-evidence
          path: outputs/web-r2c302-cdp
          retention-days: 14
