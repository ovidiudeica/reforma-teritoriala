name: Temporary ACTUAL provenance rebind

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

jobs:
  rebind:
    if: github.head_ref == 'actual/harden-write-boundaries-promotion-v2'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ovidiudeica/reforma-teritoriala-actual-runtime@sha256:67fd65aa8fba6bb2555741a485f06149793d24c67424d373eae4db818850a95a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Regenerate exact build-environment provenance
        run: |
          set -euo pipefail
          npm run build:actual-build-environment
          npm run audit:actual-build-environment

      - name: Rebind release manifest and gate without semantic churn
        env:
          ACTUAL_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          npm run build:actual-release-manifest
          npm run audit:actual-release-gate

      - name: Rebind persisted marker to exact provenance
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          const markerPath='data/current/actual-release-persisted.json';
          const manifestPath='data/current/actual-release-manifest.json';
          const gatePath='data/current/actual-release-gate.json';
          const marker=JSON.parse(await readFile(markerPath,'utf8'));
          const manifestBytes=await readFile(manifestPath);
          const manifest=JSON.parse(manifestBytes);
          const gate=JSON.parse(await readFile(gatePath,'utf8'));
          if(gate.status!=='PASS')throw new Error('Release gate must PASS before provenance rebind');
          if(marker.snapshot_id!==manifest.snapshot_id)throw new Error('Provenance rebind changed snapshot id');
          if(marker.release_fingerprint_sha256!==manifest.release_fingerprint_sha256)throw new Error('Provenance rebind changed release fingerprint');
          const sha=x=>createHash('sha256').update(x).digest('hex');
          const next={
            ...marker,
            manifest_sha256:sha(manifestBytes),
            source_bundle_fingerprint_sha256:manifest.source_bundle?.bundle_fingerprint_sha256??null,
            review_evidence_bundle_fingerprint_sha256:manifest.review_evidence_bundle?.bundle_fingerprint_sha256??null,
            network_denial_sha256:manifest.network_denial?.sha256??null,
            host_trust_fingerprint_sha256:manifest.host_trust?.host_trust_fingerprint_sha256??null,
            build_environment_fingerprint_sha256:manifest.build_environment?.environment_fingerprint_sha256??null,
            validated_release_gate_status:'PASS',
            provenance_migration:{
              previous_manifest_sha256:marker.manifest_sha256??null,
              reason:'actual-write-boundary-promotion-hardening'
            }
          };
          await writeFile(markerPath,JSON.stringify(next,null,2)+'\n');
          console.log(JSON.stringify({
            status:'PASS',
            snapshot_id:next.snapshot_id,
            release_fingerprint_sha256:next.release_fingerprint_sha256,
            manifest_sha256:next.manifest_sha256,
            build_environment_fingerprint_sha256:next.build_environment_fingerprint_sha256,
            host_trust_fingerprint_sha256:next.host_trust_fingerprint_sha256
          },null,2));
          NODE

      - name: Upload exact rebind bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actual-hardening-provenance-rebind-${{ github.run_id }}
          path: |
            data/current/actual-build-environment-manifest.json
            data/current/actual-build-environment-gate.json
            data/current/actual-release-manifest.json
            data/current/actual-release-gate.json
            data/current/actual-release-persisted.json
          if-no-files-found: error
