name: Temporary ACTUAL provenance rebind

on:
  pull_request:
    paths:
      - '.github/workflows/rebind-actual-provenance.yml'

permissions:
  contents: write
  packages: read

jobs:
  rebind:
    if: github.head_ref == 'actual/provenance-osm-refresh-control-home'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ovidiudeica/reforma-teritoriala-actual-runtime@sha256:67fd65aa8fba6bb2555741a485f06149793d24c67424d373eae4db818850a95a
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out provenance branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Trust mounted workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pinned dependencies
        run: npm run install:actual-offline-deps

      - name: Rebind build and release provenance
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node scripts/process/build-actual-build-environment-manifest.mjs
          node scripts/process/audit-actual-build-environment-gate.mjs
          ACTUAL_BASE_REF="$BASE_SHA" node scripts/process/build-actual-release-manifest.mjs
          node scripts/process/audit-actual-release-gate.mjs
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          const p='data/current/actual-release-persisted.json';
          const marker=JSON.parse(await readFile(p,'utf8'));
          const previousManifestSha=marker.manifest_sha256;
          const manifestBytes=await readFile('data/current/actual-release-manifest.json');
          const manifest=JSON.parse(manifestBytes.toString('utf8'));
          const build=JSON.parse(await readFile('data/current/actual-build-environment-manifest.json','utf8'));
          const sha256=b=>createHash('sha256').update(b).digest('hex');
          marker.manifest_sha256=sha256(manifestBytes);
          marker.source_bundle_fingerprint_sha256=manifest.source_bundle.bundle_fingerprint_sha256;
          marker.review_evidence_bundle_fingerprint_sha256=manifest.review_evidence_bundle.bundle_fingerprint_sha256;
          marker.network_denial_sha256=manifest.network_denial.sha256;
          marker.host_trust_fingerprint_sha256=manifest.host_trust.host_trust_fingerprint_sha256;
          marker.build_environment_fingerprint_sha256=build.environment_fingerprint_sha256;
          marker.validated_release_gate_status='PASS';
          marker.provenance_hardening={
            previous_manifest_sha256:previousManifestSha,
            reason:'Bind writable HOME fix for the unprivileged OSM source-refresh control phase without changing ACTUAL semantic identity.'
          };
          await writeFile(p,JSON.stringify(marker,null,2)+'\n');
          NODE

      - name: Commit provenance rebind
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/current/actual-build-environment-manifest.json             data/current/actual-build-environment-gate.json             data/current/actual-release-manifest.json             data/current/actual-release-gate.json             data/current/actual-release-persisted.json
          git diff --cached --quiet && { echo "No provenance bytes changed"; exit 1; }
          git commit -m "Rebind ACTUAL provenance for OSM refresh fix"
          git push origin "HEAD:$HEAD_BRANCH"
