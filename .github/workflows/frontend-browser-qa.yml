name: Frontend browser QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Record preinstalled browser and check syntax
        run: |
          google-chrome --version
          node --check scripts/test/helpers/atlas-browser.mjs
          node --check scripts/test/frontend-atlas-browser.test.mjs
          node --check scripts/test/frontend-cartography-browser.test.mjs
          node --check atlas-tree.mjs
          node --check atlas-osm-roles.mjs
          node --check scripts/test/frontend-p907216-osm-roles.test.mjs
          node --check scripts/test/frontend-p907216-osm-roles-browser.test.mjs
          node --check atlas-nistrenia-osm.mjs
          node --check atlas-nistrenia-jurisdiction.mjs
          node --check atlas-nistrenia-outlines.mjs
          node --check scripts/process/build-p9095-outline-evidence.mjs
          node --check scripts/test/frontend-p9095-outline-parity.test.mjs
          node --check scripts/test/frontend-p9095-outline-browser.test.mjs
          node --check scripts/test/frontend-p9095-selection-browser.test.mjs
          node --check scripts/test/frontend-p9094-operational-browser.test.mjs
          node --check scripts/test/frontend-p909-nistrenia-browser.test.mjs
          node --check atlas-tree-window.mjs
          node --check scripts/test/helpers/atlas-evidence.mjs
          node --check scripts/audit/p73-virtual-tree-browser.mjs
          node --check atlas-panels.mjs
          node --check atlas-explorer-shell.mjs
          node --check scripts/test/frontend-explorer-shell-browser.test.mjs
          node --check scripts/test/frontend-entity-tree-browser.test.mjs
          node --check scripts/test/frontend-navigation-p53-browser.test.mjs
          node --check scripts/test/frontend-p541b-ux-browser.test.mjs
          node --check scripts/audit/p62-mobile-tablet-browser.mjs
          node --check atlas-mobile-ui.mjs
          node --check atlas-advanced-navigation.mjs
          node --check scripts/audit/p63-advanced-navigation-browser.mjs
          node --check scripts/audit/p64-final-performance-accessibility.mjs
          node --check atlas-ro-md-fit.mjs
          node --check scripts/audit/p641-ro-md-fit-browser.mjs
          node --check scripts/audit/p642-osm-basemap-zoom-browser.mjs
          node --check app.js
          node --check atlas-url-state.mjs
          node --check atlas-search.mjs
          node --check atlas-share.mjs
          node --check scripts/audit/p74-contextual-content-browser.mjs
          node --check scripts/audit/p75-modules-map-controls-browser.mjs
          node --check scripts/audit/p76-final-acceptance-browser.mjs
          node --check scripts/audit/web-r1b-layout-browser.mjs
      - name: CDP code/data separation security regressions
        run: node --test scripts/test/atlas-browser-security.test.mjs
      - name: P9.0.7.2.16 85 source-linked ACTUAL/OSM role tests
        run: node --test scripts/test/frontend-p907216-osm-roles.test.mjs
      - name: P9.0.7.2.16 real Chromium existing-geometry, mobile and OSM attribution
        run: node --test scripts/test/frontend-p907216-osm-roles-browser.test.mjs
      - name: P9.0.9 Nistrenia OSM visible navigation — Chromium desktop/mobile
        run: node --test scripts/test/frontend-p909-nistrenia-browser.test.mjs
      - name: P9.0.9.4 Nistrenia third operational jurisdiction — Chromium desktop/mobile
        run: node --test scripts/test/frontend-p9094-operational-browser.test.mjs
      - name: P9.0.9.5 8 OSM source-only outline integrity, self-test, ACTUAL/P9.1 deny
        run: |
          node scripts/process/build-p9095-outline-evidence.mjs --self-test
          node --test scripts/test/frontend-p9095-outline-parity.test.mjs
      - name: P9.0.9.5 own outline/checkbox parity, URL, Straturi, desktop/mobile Chromium
        run: node --test scripts/test/frontend-p9095-outline-browser.test.mjs
      - name: P9.0.9.5 cold parent card, URL/share and independent selection lifecycle
        run: node --test scripts/test/frontend-p9095-selection-browser.test.mjs
      - name: Run actual HTTP and Chromium UI regressions
        env:
          ATLAS_QA_OUTPUT: ${{ runner.temp }}/atlas-browser-evidence
        run: node --test scripts/test/frontend-atlas-browser.test.mjs
      - name: P4.2 browser CDP cartographic matrix (RO MD, 7 viewports, 170 states)
        env:
          TMPDIR: /tmp
        run: node --test scripts/test/frontend-cartography-browser.test.mjs
      - name: P5.1 two-pane shell, resize and contextual selection in Chrome
        run: node --test scripts/test/frontend-explorer-shell-browser.test.mjs
      - name: P5.2.1 compact per-ID tree and URL state in Chrome
        run: node --test scripts/test/frontend-entity-tree-browser.test.mjs
      - name: P5.3 filters/search navigation and independent OSM basemap in Chrome
        run: node --test scripts/test/frontend-navigation-p53-browser.test.mjs
      - name: P5.4.1b UX keyboard, responsive, reset and hidden geometry in Chrome
        run: node --test scripts/test/frontend-p541b-ux-browser.test.mjs
      - name: P6.2 mobile/tablet dock, sheet snap states, keyboard and swipe in Chrome
        env:
          ATLAS_QA_OUTPUT: ${{ runner.temp }}/atlas-browser-evidence
        run: node --test scripts/audit/p62-mobile-tablet-browser.mjs
      - name: P6.3 explicit layers, recent history, comparison, search highlights and panel collapse in Chrome
        run: node --test scripts/audit/p63-advanced-navigation-browser.mjs
      - name: P6.4 final responsive accessibility, cold/warm profile and acceptance gate
        run: node --test scripts/audit/p64-final-performance-accessibility.mjs
      - name: P6.4.1 RO+MD fit bounds, portrait-landscape and integrated zoom icon in Chrome
        run: node --test scripts/audit/p641-ro-md-fit-browser.mjs
      - name: P6.4.2 OSM icon below Leaflet zoom/home, responsive on-off and history
        run: node --test scripts/audit/p642-osm-basemap-zoom-browser.mjs
      - name: P7.1 single-instance preview, rotation and semantic invariants
        run: node --test scripts/audit/p71-responsive-preview-browser.mjs
      - name: P7.2 shared contextual panes, adaptive navigation and focus lifecycle
        run: node --test scripts/audit/p72-navigation-panels-browser.mjs
      - name: WEB-R1b native disclosures and regrouped tools — desktop/mobile Chromium
        run: node --test scripts/audit/web-r1b-layout-browser.mjs
      - name: P7.3 virtual tree model and bounded Chromium hierarchy
        run: |
          node --test scripts/test/frontend-atlas-tree-window.test.mjs scripts/test/frontend-atlas-tree-labels.test.mjs scripts/test/frontend-atlas-evidence.test.mjs
          node --test scripts/audit/p73-virtual-tree-browser.mjs
      - name: P7.4 contextual search, sharing, focus and responsive content
        run: |
          node --test scripts/test/frontend-atlas-share.test.mjs scripts/test/frontend-atlas-search.test.mjs
          node --test scripts/audit/p74-contextual-content-browser.mjs
      - name: P7.5 module availability and adaptive Leaflet command owner
        run: node --test scripts/audit/p75-modules-map-controls-browser.mjs
      - name: P7.6 genuine mobile cold/warm and final accessibility supplements
        run: node --test scripts/audit/p76-final-acceptance-browser.mjs
      - name: P9.0.9.5 structural sheet and complete attribution matrix
        run: node --test scripts/audit/p9095-structural-layout-browser.mjs
      - name: P8.0.1 independent geometry reset and History
        run: node --test scripts/audit/p801-reset-geometries-browser.mjs
      - name: P8.0.2 synchronized panel and Leaflet geometry reset
        run: node --test scripts/audit/p802-map-geometry-reset-browser.mjs
      - name: P8.1 robust geometry, exhaustive corpus and independent identification
        run: |
          node --test scripts/test/frontend-point-geometry.test.mjs scripts/test/frontend-point-identification.test.mjs scripts/test/frontend-point-corpus.test.mjs
          node --test scripts/audit/p81-territory-point-browser.mjs
      - name: P8.2 verified neighbors, frontiers and independent contextual UI
        run: |
          npm ci --ignore-scripts
          node --test scripts/test/frontend-neighbors-geometry.test.mjs scripts/test/frontend-neighbors-engine.test.mjs scripts/test/frontend-neighbors-corpus.test.mjs
          node --test scripts/audit/p82-neighbors-browser.mjs
      - name: Verify tracked data untouched
        run: git diff --exit-code
      - name: Upload P4.2 CDP matrix and viewport screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-cartography-p42-evidence
          path: /tmp/atlas-browser-evidence/p42-*
          retention-days: 14
      - name: Upload screenshots and console/network evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-browser-evidence
          path: |
            ${{ runner.temp }}/atlas-browser-evidence
            /tmp/atlas-browser-evidence/p64-*
            /tmp/atlas-browser-evidence/p71-*
            /tmp/atlas-browser-evidence/p72-*
            /tmp/atlas-browser-evidence/web-r1b-*
            /tmp/atlas-browser-evidence/p73-*
            /tmp/atlas-browser-evidence/p74-*
            /tmp/atlas-browser-evidence/p75-*
            /tmp/atlas-browser-evidence/p76-*
            /tmp/atlas-browser-evidence/p9095-*
            /tmp/atlas-browser-evidence/p801-*
            /tmp/atlas-browser-evidence/p802-*
            /tmp/atlas-browser-evidence/p81-*
            /tmp/atlas-browser-evidence/p82-*
          retention-days: 14
