name: P9.0.7.2.16 source-only OSM role UI gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  p907216-osm-ui-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Verify only source-attributed OSM roles and existing ACTUAL snapshot
        run: |
          node --check atlas-osm-roles.mjs
          node --check app.js
          node --check scripts/process/build-p907216-osm-role-ui.mjs
          node --check docs/p9.0.7.2.16-validate.mjs
          node --check scripts/test/frontend-p907216-osm-roles.test.mjs
          node docs/p9.0.7.2.16-validate.mjs
          node --test scripts/test/frontend-p907216-osm-roles.test.mjs
          node scripts/process/build-p907216-osm-role-ui.mjs --check
          node --check atlas-nistrenia-osm.mjs
          node --check atlas-nistrenia-jurisdiction.mjs
          node --check scripts/test/frontend-p9094-operational-jurisdiction.test.mjs
          node --check scripts/process/build-p909-nistrenia-menu.mjs
          node --check scripts/test/frontend-p909-nistrenia-menu.test.mjs
          node --check scripts/test/frontend-p909-nistrenia-browser.test.mjs
          node scripts/process/build-p909-nistrenia-menu.mjs --check
          node --test scripts/test/frontend-p909-nistrenia-menu.test.mjs
          node --test scripts/test/frontend-p9094-operational-jurisdiction.test.mjs
      - name: Ensure no write path into existing ACTUAL release
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
