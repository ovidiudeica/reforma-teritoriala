name: OSM-ACQ.2c full UNKNOWN inventory and authenticated batch 01
on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2c-full-batch01.yml'
      - 'scripts/audit/osm_acq2c_full_batch.py'
      - 'scripts/audit/test_osm_acq2c_full_batch.py'
      - 'docs/evidence/osm-acq2b-way-history-20261022/combined-registry.json.gz'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-unknown-batch01:
    name: osm-acq2c-full-unknown-batch01
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out immutable PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Offline fail-closed planner negative tests
        run: python scripts/audit/test_osm_acq2c_full_batch.py
      - name: Acquire nonduplicated official history at the frozen epoch
        run: python scripts/audit/osm_acq2c_full_batch.py
      - name: Preserve full 242-ID ledger, originals and SHA-256
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osm-acq2c-full-unknown-batch01
          path: outputs/osm-acq2c-full-batch01/
          if-no-files-found: error
          retention-days: 30
