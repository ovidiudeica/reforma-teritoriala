name: Frontend geometry taxonomy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend-geometry-taxonomy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install frozen dependencies
        run: node scripts/process/install-actual-npm-offline.mjs
      - name: Check JavaScript syntax
        run: |
          node --check atlas-layout.mjs
          node --check atlas-preview.mjs
          node --check app.js
          node --check geometry-taxonomy.mjs
          node --check atlas-tree.mjs
          node --check atlas-hierarchy-validate.mjs
          node --check atlas-filters.mjs
          node --check atlas-search.mjs
          node --check atlas-url-state.mjs
          node --check atlas-mobile-ui.mjs
          node --check atlas-presentation.mjs
          node --check atlas-name-format.mjs
          node --check scripts/test/frontend-geometry-matrix.test.mjs
      - name: Run frontend and P2 public regressions
        run: node --test scripts/test/frontend-atlas-preview.test.mjs scripts/test/frontend-smoke.test.mjs scripts/test/actual-statistical-public.test.mjs scripts/test/frontend-geometry-taxonomy.test.mjs scripts/test/frontend-atlas-tree.test.mjs scripts/test/frontend-atlas-hierarchy-validate.test.mjs scripts/test/frontend-atlas-filters.test.mjs scripts/test/frontend-atlas-search.test.mjs scripts/test/frontend-atlas-name-format.test.mjs scripts/test/frontend-atlas-url-state.test.mjs scripts/test/frontend-atlas-mobile.test.mjs scripts/test/frontend-atlas-a11y.test.mjs
      - name: P4.1 exhaustive geometry and visibility matrix (5848 x 170)
        run: node --test scripts/test/frontend-geometry-matrix.test.mjs
      - name: Verify tests leave tracked data unchanged
        run: git diff --exit-code
