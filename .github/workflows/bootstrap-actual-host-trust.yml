name: Bootstrap ACTUAL host trust provenance

on:
  push:
    branches:
      - actual/host-trust-boundary

permissions:
  contents: write
  packages: read

concurrency:
  group: bootstrap-actual-host-trust
  cancel-in-progress: true

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-host-trust]') }}
    runs-on: ubuntu-24.04
    env:
      ACTUAL_RUNTIME_IMAGE: ghcr.io/ovidiudeica/reforma-teritoriala-actual-runtime@sha256:f42f3147dade3cdc7cc0765a70e4549a882015e81194ae242e709fc7aa0a0f40
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: actual/host-trust-boundary
          fetch-depth: 0

      - name: Fetch immutable main base
        run: git fetch origin main

      - name: Build committed host trust contract
        run: node scripts/process/build-actual-host-trust-manifest.mjs

      - name: Prove live host matches trust contract
        env:
          ACTUAL_HOST_TRUST_AUDIT_PATH: ${{ runner.temp }}/actual-host-trust-audit.json
        run: node scripts/process/audit-actual-host-trust.mjs

      - name: Pull exact ACTUAL runtime
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$ACTUAL_RUNTIME_IMAGE"

      - name: Rebuild ACTUAL provenance in host-neutral deterministic profile
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --cpuset-cpus 0 \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace \
            --env ACTUAL_BASE_REF=origin/main \
            --env ACTUAL_NETWORK_MODE=docker-network-none \
            --env NODE_OPTIONS=--jitless \
            --env UV_THREADPOOL_SIZE=1 \
            --env TZ=UTC \
            --env LANG=C.UTF-8 \
            --env LC_ALL=C.UTF-8 \
            --env GITHUB_ACTIONS=true \
            --env RUNNER_OS=Linux \
            --env HOME=/tmp/actual-home \
            "$ACTUAL_RUNTIME_IMAGE" \
            bash -lc '
              set -euo pipefail
              mkdir -p "$HOME"
              git config --global --add safe.directory /workspace
              npm run prove:actual-network-denial
              npm run build:actual-runtime-image-manifest
              npm run audit:actual-runtime-image
              npm run audit:actual-npm-dependency-bundle
              npm run build:actual-build-environment
              npm run audit:actual-build-environment
              npm run audit:node-toolchain
              npm run install:actual-offline-deps
              npm run build:actual-source-bundle
              npm run audit:actual-source-bundle
              npm run build:actual-review-evidence-bundle
              npm run audit:actual-review-evidence-bundle
              npm run build:actual-release-manifest
              npm run audit:actual-release-gate
            '

      - name: Rewrite persisted provenance marker without semantic churn
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile,writeFile} from 'node:fs/promises';
          const path='data/current/actual-release-persisted.json';
          const old=JSON.parse(await readFile(path,'utf8'));
          const manifestBytes=await readFile('data/current/actual-release-manifest.json');
          const manifest=JSON.parse(manifestBytes);
          if(old.snapshot_id!==manifest.snapshot_id||old.release_fingerprint_sha256!==manifest.release_fingerprint_sha256){
            throw new Error('Host-trust migration attempted to change ACTUAL semantic identity.');
          }
          const next={
            schema_version:1,
            snapshot_id:manifest.snapshot_id,
            release_fingerprint_sha256:manifest.release_fingerprint_sha256,
            manifest_sha256:createHash('sha256').update(manifestBytes).digest('hex'),
            source_bundle_fingerprint_sha256:manifest.source_bundle?.bundle_fingerprint_sha256??null,
            review_evidence_bundle_fingerprint_sha256:manifest.review_evidence_bundle?.bundle_fingerprint_sha256??null,
            network_denial_sha256:manifest.network_denial?.sha256??null,
            host_trust_fingerprint_sha256:manifest.host_trust?.host_trust_fingerprint_sha256??null,
            build_environment_fingerprint_sha256:manifest.build_environment?.environment_fingerprint_sha256??null,
            validated_release_gate_status:'PASS',
            provenance_migration:{previous_manifest_sha256:old.manifest_sha256??null,reason:'host-trust-boundary'},
            policy:'Marker for exact ACTUAL snapshot bytes, exact source provenance, frozen review evidence, kernel network denial, explicit host-trust contract and exact execution-environment provenance. It is not part of semantic release identity.'
          };
          await writeFile(path,JSON.stringify(next,null,2)+'\n');
          NODE

      - name: Remove one-shot bootstrap before final regression suite
        run: rm -f .github/workflows/bootstrap-actual-host-trust.yml

      - name: Run complete lifecycle regression in deterministic profile
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --cpuset-cpus 0 \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace" \
            --workdir /workspace \
            --env ACTUAL_NETWORK_MODE=docker-network-none \
            --env NODE_OPTIONS=--jitless \
            --env UV_THREADPOOL_SIZE=1 \
            --env TZ=UTC \
            --env LANG=C.UTF-8 \
            --env LC_ALL=C.UTF-8 \
            --env GITHUB_ACTIONS=true \
            --env RUNNER_OS=Linux \
            --env HOME=/tmp/actual-home \
            "$ACTUAL_RUNTIME_IMAGE" \
            bash -lc '
              set -euo pipefail
              mkdir -p "$HOME"
              git config --global --add safe.directory /workspace
              node scripts/process/verify-actual-persisted-base.mjs
              npm run test:actual-candidate-lifecycle
              npm run audit:actual-release-gate
            '

      - name: Commit host trust provenance migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/bootstrap-actual-host-trust.yml
          git add data/current/actual-host-trust-manifest.json \
            data/current/actual-network-denial-audit.json \
            data/current/actual-runtime-image.json \
            data/current/actual-source-bundle-manifest.json \
            data/current/actual-source-bundle-gate.json \
            data/current/actual-review-evidence-bundle.json \
            data/current/actual-review-evidence-bundle-gate.json \
            data/current/actual-build-environment-manifest.json \
            data/current/actual-build-environment-gate.json \
            data/current/actual-release-manifest.json \
            data/current/actual-release-gate.json \
            data/current/actual-release-persisted.json
          git diff --cached --quiet && exit 0
          git commit -m "Bind ACTUAL host trust provenance [bootstrap-host-trust]"
          git push origin HEAD:actual/host-trust-boundary
