name: Prove deterministic ACTUAL candidate metadata

on:
  push:
    branches:
      - actual/deterministic-candidate-metadata

permissions:
  contents: read
  packages: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ovidiudeica/reforma-teritoriala-actual-runtime@sha256:f42f3147dade3cdc7cc0765a70e4549a882015e81194ae242e709fc7aa0a0f40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: actual/deterministic-candidate-metadata
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm run audit:actual-npm-dependency-bundle
      - run: npm run install:actual-offline-deps
      - run: npm run test:actual-candidate-lifecycle
