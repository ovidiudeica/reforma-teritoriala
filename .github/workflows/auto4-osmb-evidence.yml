name: AUTO-4 individual OSMB evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/auto4-osmb-109/**'
      - 'docs/audits/auto4-history-followup-20261031/**'
      - 'scripts/audit/auto4-osmb-*'
      - '.github/workflows/auto4-osmb-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'docs/audits/auto4-osmb-109/**'
      - 'docs/audits/auto4-history-followup-20261031/**'
      - 'scripts/audit/auto4-osmb-*'
      - '.github/workflows/auto4-osmb-evidence.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node scripts/audit/auto4-osmb-verify.mjs
      - run: python -m pip install shapely==2.2.0 pyproj==3.8.0 numpy==2.5.4
      - run: python scripts/audit/auto4-osmb-geometry.py
      - run: python scripts/audit/auto4-osmb-history-followup.py
      - run: git diff --exit-code
