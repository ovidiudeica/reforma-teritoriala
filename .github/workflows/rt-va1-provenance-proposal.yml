name: RT-VA1 provenance-only rebuild proposal
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/actual-candidate.yml'
      - '.github/workflows/actual-promote-candidate.yml'
      - '.github/workflows/rt-va1-provenance-proposal.yml'
      - 'scripts/process/run-actual-deterministic-candidate.sh'
      - 'scripts/process/prepare-rt-va1-provenance-only.mjs'
      - 'data/current/actual-build-environment-manifest.json'
      - 'data/current/actual-build-environment-gate.json'
      - 'data/current/actual-release-manifest.json'
      - 'data/current/actual-release-gate.json'
      - 'data/current/actual-release-persisted.json'
permissions:
  contents: read
jobs:
  proposal:
    if: github.event.pull_request.head.repo.full_name == 'ovidiudeica/reforma-teritoriala' && startsWith(github.event.pull_request.head.ref, 'actual/provenance-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact provenance PR with immutable base history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Pin Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Authenticate unchanged persisted ACTUAL baseline
        run: node scripts/process/verify-actual-persisted-base.mjs
      - name: Rebuild and gate exact provenance, never semantic content
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          node scripts/process/build-actual-build-environment-manifest.mjs
          node scripts/process/audit-actual-build-environment-gate.mjs
          node scripts/process/build-actual-release-manifest.mjs
          node scripts/process/audit-actual-release-gate.mjs
          node scripts/process/prepare-rt-va1-provenance-only.mjs
          node scripts/process/verify-actual-persisted-base.mjs
      - name: Preserve exact generated proposal (read-only workflow)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rt-va1-provenance-proposal
          if-no-files-found: warn
          path: |
            data/current/actual-build-environment-manifest.json
            data/current/actual-build-environment-gate.json
            data/current/actual-release-manifest.json
            data/current/actual-release-gate.json
            data/current/actual-release-persisted.json
