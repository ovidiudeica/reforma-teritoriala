name: WEB-R2c.3.2 Chromium hardening
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Exact source and installed Chromium
        run: |
          git rev-parse HEAD
          google-chrome --version
          node --check scripts/audit/ni-tree2-hardening-browser.mjs
          node --test scripts/test/frontend-published-source.test.mjs
          node --test scripts/test/frontend-navigation-failure-evidence.test.mjs scripts/test/frontend-performance-navigation.test.mjs
      - name: Combined responsive, accessibility, native zoom and network matrix
        run: node scripts/audit/ni-tree2-hardening-browser.mjs
      - name: Verify report source and protected tracked files
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; import {execFileSync} from 'node:child_process'; const r=JSON.parse(fs.readFileSync('outputs/web-r2c32-hardening/report.json')); assert.equal(r.status,'PASS'); assert.equal(r.trackedSourcesClean,true); assert.equal(r.sourceSha,execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim());"
          git diff --exit-code
      - name: Archive screenshots, AX/layout/contrast and raw network evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-r2c32-hardening-evidence
          path: outputs/web-r2c32-hardening
          retention-days: 14
