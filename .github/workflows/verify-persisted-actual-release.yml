# Post-release read-only guard for the persisted ACTUAL snapshot.
name: Verify persisted ACTUAL release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify-persisted-release:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ovidiudeica/reforma-teritoriala-actual-runtime@sha256:f42f3147dade3cdc7cc0765a70e4549a882015e81194ae242e709fc7aa0a0f40
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Gate pinned ACTUAL OCI runtime
        run: npm run audit:actual-runtime-image

      - name: Audit vendored npm dependency bundle
        run: npm run audit:actual-npm-dependency-bundle

      - name: Audit pinned ACTUAL execution environment
        env:
          ACTUAL_BUILD_ENVIRONMENT_GATE_READ_ONLY: '1'
        run: npm run audit:actual-build-environment

      - name: Audit pinned Node/npm toolchain
        run: npm run audit:node-toolchain

      - name: Require a clean checkout
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify persisted release marker
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFile} from 'node:fs/promises';

          const markerPath='data/current/actual-release-persisted.json';
          const manifestPath='data/current/actual-release-manifest.json';
          const sourceBundlePath='data/current/actual-source-bundle-manifest.json';
          const buildEnvironmentPath='data/current/actual-build-environment-manifest.json';
          const [markerText,manifestBytes,sourceBundleBytes,buildEnvironmentBytes]=await Promise.all([
            readFile(markerPath,'utf8'),
            readFile(manifestPath),
            readFile(sourceBundlePath),
            readFile(buildEnvironmentPath)
          ]);
          const marker=JSON.parse(markerText);
          const manifest=JSON.parse(manifestBytes.toString('utf8'));
          const sourceBundle=JSON.parse(sourceBundleBytes.toString('utf8'));
          const buildEnvironment=JSON.parse(buildEnvironmentBytes.toString('utf8'));
          const manifestSha=createHash('sha256').update(manifestBytes).digest('hex');
          const sourceBundleSha=createHash('sha256').update(sourceBundleBytes).digest('hex');
          const buildEnvironmentSha=createHash('sha256').update(buildEnvironmentBytes).digest('hex');

          const failures=[];
          if(marker.schema_version!==1)failures.push({issue:'marker_schema_version',actual:marker.schema_version});
          if(marker.validated_release_gate_status!=='PASS')failures.push({issue:'persisted_gate_not_pass',actual:marker.validated_release_gate_status});
          if(marker.snapshot_id!==manifest.snapshot_id)failures.push({issue:'snapshot_id_mismatch',marker:marker.snapshot_id,manifest:manifest.snapshot_id});
          if(marker.release_fingerprint_sha256!==manifest.release_fingerprint_sha256)failures.push({issue:'release_fingerprint_mismatch',marker:marker.release_fingerprint_sha256,manifest:manifest.release_fingerprint_sha256});
          if(marker.manifest_sha256!==manifestSha)failures.push({issue:'manifest_sha256_mismatch',marker:marker.manifest_sha256,actual:manifestSha});
          if(marker.source_bundle_fingerprint_sha256!==manifest.source_bundle?.bundle_fingerprint_sha256)failures.push({issue:'source_bundle_fingerprint_mismatch',marker:marker.source_bundle_fingerprint_sha256,manifest:manifest.source_bundle?.bundle_fingerprint_sha256??null});
          if(manifest.source_bundle?.sha256!==sourceBundleSha)failures.push({issue:'source_bundle_sha256_mismatch',manifest:manifest.source_bundle?.sha256??null,actual:sourceBundleSha});
          if(manifest.source_bundle?.bundle_fingerprint_sha256!==sourceBundle.bundle_fingerprint_sha256)failures.push({issue:'source_bundle_manifest_binding_mismatch'});
          if(marker.build_environment_fingerprint_sha256!==manifest.build_environment?.environment_fingerprint_sha256)failures.push({issue:'build_environment_fingerprint_mismatch',marker:marker.build_environment_fingerprint_sha256,manifest:manifest.build_environment?.environment_fingerprint_sha256??null});
          if(manifest.build_environment?.sha256!==buildEnvironmentSha)failures.push({issue:'build_environment_sha256_mismatch',manifest:manifest.build_environment?.sha256??null,actual:buildEnvironmentSha});
          if(manifest.build_environment?.environment_fingerprint_sha256!==buildEnvironment.environment_fingerprint_sha256)failures.push({issue:'build_environment_manifest_binding_mismatch'});

          const report={
            status:failures.length?'FAIL':'PASS',
            snapshot_id:manifest.snapshot_id??null,
            release_fingerprint_sha256:manifest.release_fingerprint_sha256??null,
            manifest_sha256:manifestSha,
            source_bundle_fingerprint_sha256:sourceBundle.bundle_fingerprint_sha256??null,
            build_environment_fingerprint_sha256:buildEnvironment.environment_fingerprint_sha256??null,
            failures
          };
          console.log(JSON.stringify(report,null,2));
          if(failures.length)process.exit(1);
          NODE

      - name: Verify exact persisted snapshot bytes
        env:
          ACTUAL_RELEASE_GATE_READ_ONLY: "1"
        run: node scripts/process/audit-actual-release-gate.mjs

      - name: Regression-test NO_CHANGE and synthetic CHANGE lifecycle
        run: npm run test:actual-candidate-lifecycle

      - name: Prove verification is read-only
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Read-only verification changed the working tree:"
            git status --short --untracked-files=all
            git diff -- .
            exit 1
          fi
