name: WEB-R3.3 focused Chromium desktop/mobile
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-r33:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Record exact commit and Chrome
        run: |
          git rev-parse HEAD
          google-chrome --version
          node --check scripts/audit/web-r33-functional-visual-browser.mjs
      - name: WEB-R3.3 functional and visual acceptance
        run: node --test scripts/audit/web-r33-functional-visual-browser.mjs
      - name: Preserve R3.3 report and viewport screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-r33-chromium-evidence
          path: /tmp/atlas-browser-evidence/web-r33-*
          retention-days: 30
          if-no-files-found: error
