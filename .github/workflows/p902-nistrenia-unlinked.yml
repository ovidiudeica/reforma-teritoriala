name: P9.0.2 Nistrenia unlinked OSM audit (read-only)
on:
  pull_request:
    branches: [audit/p9.0.1-nistrenia-inventory]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unlinked:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node scripts/process/install-actual-npm-offline.mjs
      - name: Baseline immutable OSM to ACTUAL MD matrix
        run: node scripts/audit/p901-nistrenia-inventory.mjs
      - name: Discover unlinked OSM candidates and propose reuse
        run: node scripts/audit/p902-nistrenia-unlinked.mjs
      - name: Upload all data and exceptions, even if external OSM sources fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p902-unlinked-and-reuse-audit
          path: |
            outputs/P9.0.1/
            outputs/P9.0.2/
