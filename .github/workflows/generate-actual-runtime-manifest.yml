name: Generate ACTUAL OCI runtime manifest

on:
  push:
    branches:
      - 'actual/pin-oci-runtime'
    paths:
      - '.github/workflows/generate-actual-runtime-manifest.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: actual/pin-oci-runtime
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'

      - name: Build and audit runtime manifest
        run: |
          node scripts/process/build-actual-runtime-image-manifest.mjs
          node scripts/process/audit-actual-runtime-image.mjs

      - name: Commit deterministic runtime manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/actual-runtime-image.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist ACTUAL OCI runtime manifest"
          git push origin HEAD:actual/pin-oci-runtime
