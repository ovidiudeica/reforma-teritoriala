name: OSM-ACQ.2c full-history bulk preflight (offline only)
on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2c-bulk-preflight.yml'
      - 'scripts/audit/osm_acq2c_bulk_preflight.py'
      - 'scripts/audit/test_osm_acq2c_bulk_preflight.py'
      - 'docs/evidence/osm-acq2c-full-history-bulk-preflight-20261022/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight:
    name: osm-acq2c-bulk-preflight-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Negative provenance, native-byte determinism and fixed cohort tests
        run: python scripts/audit/test_osm_acq2c_bulk_preflight.py
      - name: Generate exact offline dependency IDs — never bulk-download OSM editing API
        run: python scripts/audit/osm_acq2c_bulk_preflight.py
      - name: Conserve deterministic plan without contributor XML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osm-acq2c-full-history-preflight-plan
          path: outputs/osm-acq2c-bulk-preflight/
          if-no-files-found: error
          retention-days: 30
