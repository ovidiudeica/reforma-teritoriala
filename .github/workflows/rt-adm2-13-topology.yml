name: RT-ADM.2.13 geometric overlay validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit/rt-adm2-13-topology.py'
      - '.github/workflows/rt-adm2-13-topology.yml'
      - 'docs/audits/rt-adm2-13/**'
permissions:
  contents: read
jobs:
  exact-overlay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check 'shapely==2.1.2' 'pyproj==3.7.2'
      - run: python scripts/audit/rt-adm2-13-topology.py
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rt-adm2-13-topological-overlay
          path: outputs/RT-ADM.2.13/topological-overlay.json
