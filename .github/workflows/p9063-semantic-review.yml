name: P9.0.6.3 final semantic review (audit only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/p9.0.6.3-*'
      - '.github/workflows/p9063-semantic-review.yml'
permissions:
  contents: read
jobs:
  semantic-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Fail-closed 85 identity documentary and exact OSM source evidence gate
        run: node docs/p9.0.6.3-validate-semantic.mjs
      - name: Assert no modifications in ACTUAL production data
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ HEAD -- data/current public/geo/actual || {
            echo 'P9.0.6.3 must never mutate ACTUAL or public geometries' >&2
            exit 1
          }
