name: OSM-ACQ.2c conditional leaf closure offline validation
on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2c-leaf-closure.yml'
      - 'scripts/audit/osm_acq2c_selected_epoch_leaf.py'
      - 'scripts/audit/test_osm_acq2c_selected_epoch_leaf.py'
      - 'scripts/audit/validate_osm_acq2c_leaf_capsule.py'
      - 'scripts/audit/test_osm_acq2c_evidence_paths.py'
      - 'scripts/audit/osm_acq2c_selected_epoch_core.py'
      - 'scripts/audit/osm_acq2c_selected_epoch_replay.py'
      - 'scripts/audit/osm_acq2c_frontier.py'
      - 'docs/evidence/osm-acq2c-leaf-closure-20261024/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leaf-closure-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Negative tests and sparse proof replay
        run: |
          python scripts/audit/test_osm_acq2c_selected_epoch_leaf.py
          python scripts/audit/test_osm_acq2c_evidence_paths.py
          python scripts/audit/validate_osm_acq2c_leaf_capsule.py docs/evidence/osm-acq2c-leaf-closure-20261024
