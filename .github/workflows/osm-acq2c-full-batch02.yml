name: OSM-ACQ.2c batch02 non-overlapping historical acquisition
on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2c-full-batch02.yml'
      - 'scripts/audit/osm_acq2c_full_batch02.py'
      - 'scripts/audit/test_osm_acq2c_full_batch02.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-64:
    name: osm-acq2c-full-unknown-batch02
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Five pinned continuity and non-duplication tests
        run: python scripts/audit/test_osm_acq2c_full_batch02.py
      - name: Capture second unique 64-object history batch
        run: python scripts/audit/osm_acq2c_full_batch02.py
      - name: Retain exact original XML and manifest even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osm-acq2c-full-unknown-batch02
          path: outputs/osm-acq2c-full-batch02/
          if-no-files-found: error
          retention-days: 30
