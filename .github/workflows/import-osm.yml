name: Import OSM administrative data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install
      - run: npm run import:osm
      - name: Commit generated catalog and GeoJSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/entities.json data/current/import-report.json public/geo/current/
          git diff --cached --quiet || git commit -m "data: refresh OSM administrative catalog"
          git push
