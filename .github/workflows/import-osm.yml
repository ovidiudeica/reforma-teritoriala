name: Refresh OSM administrative source snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osm-source-refresh
  cancel-in-progress: false

jobs:
  refresh-through-candidate:
    uses: ./.github/workflows/actual-candidate.yml
    with:
      base_release_commit: ${{ github.sha }}
      candidate_branch: ''
      refresh_ro_siruta: false
      refresh_md_cuatm: false
      refresh_osm: true
      source_trigger: 'osm-refresh'
