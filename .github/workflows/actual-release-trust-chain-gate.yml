name: Gate ACTUAL release trust chain

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-release-trust-chain:
    name: actual-release-trust-chain
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Audit workflow write boundaries
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readdir,readFile} from 'node:fs/promises';
          import {join} from 'node:path';

          const dir='.github/workflows';
          const files=(await readdir(dir)).filter(name=>/\.ya?ml$/i.test(name)).sort();
          const allowedContentsWrite=new Set([
            'actual-candidate.yml',
            'actual-promote-candidate.yml',
            'import-osm.yml',
            'refresh-actual-review-evidence.yml',
            'refresh-md-official.yml',
            'refresh-ro-official.yml'
          ]);
          const allowedPush=new Set([
            'actual-candidate.yml',
            'actual-promote-candidate.yml',
            'refresh-actual-review-evidence.yml'
          ]);
          const allowedPrCreate=new Set([
            'actual-promote-candidate.yml',
            'refresh-actual-review-evidence.yml'
          ]);
          const allowedScheduledWrite=new Set([
            'refresh-md-official.yml',
            'refresh-ro-official.yml'
          ]);
          const allowedPackagesWrite=new Set([
            'build-actual-runtime-image.yml'
          ]);

          const failures=[];
          for(const name of files){
            const text=await readFile(join(dir,name),'utf8');
            const contentsWrite=/^\s*contents:\s*write\s*$/m.test(text);
            const packagesWrite=/^\s*packages:\s*write\s*$/m.test(text);
            const gitPush=/\bgit\s+push\b/.test(text);
            const prCreate=/\bgh\s+pr\s+create\b/.test(text);
            const pushesMain=/\bgit\s+push\s+origin\s+(?:(?:HEAD:)?main|refs\/heads\/main)\b/.test(text);
            const repositoryWriteTrigger=/^\s{2}(?:push|pull_request):/m.test(text);
            const scheduledWriteTrigger=/^\s{2}schedule:/m.test(text);
            const apiWrite=/\bgh\s+api\b[^\n]*(?:--method|-X)\s+(?:POST|PUT|PATCH|DELETE)\b/i.test(text)
              || /\bcurl\b[^\n]*(?:-X|--request)\s+(?:POST|PUT|PATCH|DELETE)\b[^\n]*api\.github\.com/i.test(text)
              || /actions\/github-script@/i.test(text);
            const uses=[...text.matchAll(/^\s*uses:\s*([^\s#]+).*$/gm)].map(match=>match[1]);
            const allowedUses=new Set([
              'actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09',
              'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02',
              './.github/workflows/actual-candidate.yml'
            ]);
            const unapprovedUses=contentsWrite?uses.filter(value=>!allowedUses.has(value)):[];
            const usesCheckout=uses.some(value=>value.startsWith('actions/checkout@'));
            const checkoutCredentialPersistenceDisabled=/persist-credentials:\s*false/.test(text);
            const scopedRepositoryToken=/GITHUB_TOKEN:\s*\$\{\{ github\.token \}\}/.test(text);
            const oneShotGitAuth=/http\.https:\/\/github\.com\/\.extraheader=AUTHORIZATION: basic \$AUTH_HEADER/.test(text);

            if(contentsWrite&&!allowedContentsWrite.has(name))failures.push({issue:'unexpected_contents_write',workflow:name});
            if(!contentsWrite&&allowedContentsWrite.has(name))failures.push({issue:'expected_contents_write_missing',workflow:name});
            if(packagesWrite&&!allowedPackagesWrite.has(name))failures.push({issue:'unexpected_packages_write',workflow:name});
            if(!packagesWrite&&allowedPackagesWrite.has(name))failures.push({issue:'expected_packages_write_missing',workflow:name});
            if((gitPush||packagesWrite)&&usesCheckout&&!checkoutCredentialPersistenceDisabled)failures.push({issue:'write_workflow_persists_checkout_credentials',workflow:name});
            if(gitPush&&!scopedRepositoryToken)failures.push({issue:'git_push_missing_step_scoped_token',workflow:name});
            if(gitPush&&!oneShotGitAuth)failures.push({issue:'git_push_missing_one_shot_auth',workflow:name});
            if(gitPush&&!allowedPush.has(name))failures.push({issue:'unexpected_git_push',workflow:name});
            if(prCreate&&!allowedPrCreate.has(name))failures.push({issue:'unexpected_pr_create',workflow:name});
            if(pushesMain)failures.push({issue:'direct_push_to_main',workflow:name});
            if(contentsWrite&&repositoryWriteTrigger)failures.push({issue:'write_workflow_has_repository_event_trigger',workflow:name});
            if(contentsWrite&&scheduledWriteTrigger&&!allowedScheduledWrite.has(name))failures.push({issue:'unexpected_scheduled_write_workflow',workflow:name});
            if(contentsWrite&&!scheduledWriteTrigger&&allowedScheduledWrite.has(name))failures.push({issue:'expected_schedule_missing',workflow:name});
            if(contentsWrite&&apiWrite)failures.push({issue:'write_workflow_has_unreviewed_api_write_surface',workflow:name});
            if(packagesWrite&&contentsWrite)failures.push({issue:'package_publisher_must_not_have_contents_write',workflow:name});
            if(packagesWrite&&scheduledWriteTrigger)failures.push({issue:'package_publisher_must_not_be_scheduled',workflow:name});
            if(packagesWrite&&prCreate)failures.push({issue:'package_publisher_must_not_create_pr',workflow:name});
            if(unapprovedUses.length)failures.push({issue:'write_workflow_uses_unapproved_action',workflow:name,uses:unapprovedUses});
          }

          const runtimePublisher=await readFile(join(dir,'build-actual-runtime-image.yml'),'utf8');
          for(const needle of ["- 'actual/pin-oci-runtime'","persist-credentials: false",'packages: write','contents: read']){
            if(!runtimePublisher.includes(needle))failures.push({issue:'runtime_package_write_contract_missing',workflow:'build-actual-runtime-image.yml',needle});
          }

          const candidateWorkflow=await readFile(join(dir,'actual-candidate.yml'),'utf8');
          const reviewWorkflow=await readFile(join(dir,'refresh-actual-review-evidence.yml'),'utf8');
          if(!candidateWorkflow.includes('docker logout ghcr.io')){
            failures.push({issue:'candidate_ghcr_write_token_not_discarded_before_later_repository_execution',workflow:'actual-candidate.yml'});
          }
          for(const [workflow,text,lease] of [
            ['actual-candidate.yml',candidateWorkflow,'--force-with-lease="refs/heads/$CANDIDATE_BRANCH:"'],
            ['refresh-actual-review-evidence.yml',reviewWorkflow,'--force-with-lease="refs/heads/$BRANCH:"']
          ]){
            if(!text.includes(lease))failures.push({issue:'isolated_branch_creation_missing_absent-ref_lease',workflow,lease});
          }

          for(const wrapper of ['import-osm.yml','refresh-md-official.yml','refresh-ro-official.yml']){
            const text=await readFile(join(dir,wrapper),'utf8');
            if(!/uses:\s*\.\/\.github\/workflows\/actual-candidate\.yml/.test(text)){
              failures.push({issue:'source_refresh_does_not_route_through_candidate',workflow:wrapper});
            }
            if(/\brun:\s*[|>]?/.test(text)){
              failures.push({issue:'source_refresh_wrapper_contains_direct_run_step',workflow:wrapper});
            }
          }

          const promotionWorkflow=await readFile(join(dir,'actual-promote-candidate.yml'),'utf8');
          if(!promotionWorkflow.includes('--force-with-lease="refs/heads/$CANDIDATE_BRANCH:$EXPECTED_CANDIDATE_COMMIT"')){
            failures.push({issue:'promotion_missing_exact_candidate_lease',workflow:'actual-promote-candidate.yml'});
          }
          const preexecutionStep=promotionWorkflow.indexOf('Preflight candidate commit before repository code execution');
          const firstRepoCode=promotionWorkflow.indexOf('npm run ');
          if(preexecutionStep<0||firstRepoCode<0||preexecutionStep>firstRepoCode){
            failures.push({issue:'promotion_preexecution_preflight_missing_or_late',workflow:'actual-promote-candidate.yml'});
          }
          for(const needle of ['CANDIDATE_PARENT_SHA','candidate-preexecution-paths.txt','Candidate pre-execution write-boundary violation','genuine CHANGE candidate']){
            if(!promotionWorkflow.includes(needle))failures.push({issue:'promotion_preexecution_contract_missing',workflow:'actual-promote-candidate.yml',needle});
          }

          const report={status:failures.length?'FAIL':'PASS',workflow_count:files.length,failures};
          console.log(JSON.stringify(report,null,2));
          if(failures.length)process.exit(1);
          NODE

      - name: Validate PR publication path
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/process/audit-actual-publication-path.mjs

      - name: Confirm gate is read-only
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
