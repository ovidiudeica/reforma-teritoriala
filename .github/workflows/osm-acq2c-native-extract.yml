name: OSM-ACQ.2c native history extraction tests
on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2c-native-extract.yml'
      - 'scripts/audit/osm_acq2c_native_extract.py'
      - 'scripts/audit/osm_acq2c_pbf_blocks.py'
      - 'scripts/audit/test_osm_acq2c_pbf_blocks.py'
      - 'scripts/audit/osm_acq2c_reader_provenance.py'
      - 'scripts/audit/test_osm_acq2c_reader_provenance.py'
      - 'scripts/audit/test_osm_acq2c_native_*.py'
      - 'scripts/audit/osm_acq2c_acquire_history_base.py'
      - 'scripts/audit/osm_acq2c_bulk_preflight.py'
      - 'scripts/audit/osm_acq2c_full_batch.py'
      - 'scripts/audit/osm_acq2c_priority.py'
      - 'docs/evidence/osm-acq2c-native-extract-20261023/**'
      - 'docs/evidence/osm-acq2c-typed-reader-20261023/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/osm-acq2c-native-extract.yml'
      - 'scripts/audit/osm_acq2c_native_extract.py'
      - 'scripts/audit/osm_acq2c_pbf_blocks.py'
      - 'scripts/audit/test_osm_acq2c_pbf_blocks.py'
      - 'scripts/audit/osm_acq2c_reader_provenance.py'
      - 'scripts/audit/test_osm_acq2c_reader_provenance.py'
      - 'scripts/audit/test_osm_acq2c_native_*.py'
      - 'scripts/audit/osm_acq2c_acquire_history_base.py'
      - 'scripts/audit/osm_acq2c_bulk_preflight.py'
      - 'scripts/audit/osm_acq2c_full_batch.py'
      - 'scripts/audit/osm_acq2c_priority.py'
      - 'docs/evidence/osm-acq2c-native-extract-20261023/**'
      - 'docs/evidence/osm-acq2c-typed-reader-20261023/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install explicit native parser version
        run: python -m pip install osmium==4.3.2
      - name: Negative core and real native PBF tests; no source acquisition
        run: |
          python scripts/audit/test_osm_acq2c_native_extract.py
          python scripts/audit/test_osm_acq2c_native_pbf.py
          python scripts/audit/test_osm_acq2c_pbf_blocks.py
          python scripts/audit/test_osm_acq2c_reader_provenance.py
      - name: Verify typed-reader probe remains explicitly unqualified
        run: |
          python - <<'PY'
          import pathlib,sys,json
          sys.path.insert(0,'scripts/audit')
          from osm_acq2c_selected_epoch_replay import verify_manifest
          root=pathlib.Path('docs/evidence/osm-acq2c-typed-reader-20261023')
          verify_manifest(root)
          report=json.loads((root/'probe.json').read_bytes())
          assert report['probe_status']=='STOPPED_WITHOUT_COMPLETED_EXTRACTION'
          assert report['source_qualified'] is False and report['source_promoted'] is False
          assert report['performance_improvement_demonstrated'] is False
          assert report['selected_output_bytes']==0 and report['requested']==3959
          assert report['previous_frontier']==237019
          assert sum(report['previous_frontier_types'].values())==report['previous_frontier']
          PY
      - name: Verify complete public test evidence manifest
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('docs/evidence/osm-acq2c-native-extract-20261023')
          manifest=json.loads((root/'manifest-sha256.json').read_bytes())
          seen=set()
          for row in manifest['files']:
              name=row['name']
              assert pathlib.Path(name).name==name and name not in seen
              seen.add(name)
              raw=(root/name).read_bytes()
              assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
          assert seen=={p.name for p in root.iterdir() if p.is_file() and p.name!='manifest-sha256.json'}
          result=json.loads((root/'current-local-tests.json').read_bytes())
          assert result['source_qualified'] is False and result['unknown_adjudicated']==0
          import sys,gzip,io,tempfile,subprocess,os
          sys.path.insert(0,'scripts/audit')
          from osm_acq2c_reader_provenance import verify_sources
          from osm_acq2c_selected_epoch_replay import verify_manifest
          packet=pathlib.Path('docs/evidence/osm-acq2c-typed-reader-20261023')
          verify_manifest(packet)
          binding=json.loads((packet/'historical-source-binding.json').read_bytes())
          assert binding['git_commit']=='43e6e4c29ce81a05088ba11312c64cb18c650dfd'
          assert binding['historical_receipt_sha256']==hashlib.sha256((root/'current-local-tests.json').read_bytes()).hexdigest()
          names=('osm_acq2c_native_extract.py','test_osm_acq2c_native_extract.py','test_osm_acq2c_native_pbf.py')
          assert len(binding['sources'])==len(names) and {r['name'] for r in binding['sources']}==set(names)
          archived={}
          for name in names:
              row=next(r for r in binding['sources'] if r['name']==name)
              assert row['archive']=='previous-'+name+'.gz'
              with gzip.open(packet/('previous-'+name+'.gz'),'rb') as archive:raw=archive.read(1048577)
              assert len(raw)<=1048576 and len(raw)==row['bytes']
              assert hashlib.sha256(raw).hexdigest()==row['sha256']
              archived[name]=raw
          verify_sources(result,archived)
          with tempfile.TemporaryDirectory() as temp:
              for name in names:(pathlib.Path(temp)/name).write_bytes(archived[name])
              env={**os.environ,'PYTHONPATH':temp+os.pathsep+str(pathlib.Path('scripts/audit').resolve())+os.pathsep+os.environ.get('PYTHONPATH','')}
              for name in names[1:]:subprocess.run([sys.executable,str(pathlib.Path(temp)/name)],cwd=temp,env=env,check=True)
          current=json.loads((packet/'current-source-binding.json').read_bytes())
          current_names=(*names,'osm_acq2c_pbf_blocks.py','test_osm_acq2c_pbf_blocks.py','osm_acq2c_reader_provenance.py','test_osm_acq2c_reader_provenance.py')
          assert set(current['code_sha256'])==set(current_names)
          verify_sources(current,{name:(pathlib.Path('scripts/audit')/name).read_bytes() for name in current_names})
          PY
