name: OSM source continuity fail-closed

on:
  pull_request:
    paths:
      - '.github/workflows/actual-candidate.yml'
      - '.github/workflows/osm-source-continuity.yml'
      - 'scripts/import/import-osm.mjs'
      - 'scripts/lib/osm-source-continuity.mjs'
      - 'scripts/lib/osm-source-transition.mjs'
      - 'scripts/lib/osm-*.mjs'
      - 'scripts/test/osm-*.test.mjs'
      - 'docs/evidence/osm-fix2/**'
      - 'scripts/process/audit-osm-refresh-continuity.mjs'
      - 'scripts/process/audit-osm-fix2-source-transition.mjs'
      - 'scripts/test/osm-source-continuity.test.mjs'
      - 'scripts/test/osm-source-transition.test.mjs'
      - 'data/sources/osm-source-contract.json'
      - 'data/sources/osm-source-transition-policy.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/actual-candidate.yml'
      - '.github/workflows/osm-source-continuity.yml'
      - 'scripts/import/import-osm.mjs'
      - 'scripts/lib/osm-source-continuity.mjs'
      - 'scripts/lib/osm-source-transition.mjs'
      - 'scripts/lib/osm-*.mjs'
      - 'scripts/test/osm-*.test.mjs'
      - 'docs/evidence/osm-fix2/**'
      - 'scripts/process/audit-osm-refresh-continuity.mjs'
      - 'scripts/process/audit-osm-fix2-source-transition.mjs'
      - 'scripts/test/osm-source-continuity.test.mjs'
      - 'scripts/test/osm-source-transition.test.mjs'
      - 'data/sources/osm-source-contract.json'
      - 'data/sources/osm-source-transition-policy.json'

permissions:
  contents: read

jobs:
  source-continuity-negative-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Reject missing, altered and unapproved OSM source transitions
        run: node --test scripts/test/osm-source-continuity.test.mjs scripts/test/osm-source-transition.test.mjs scripts/test/osm-source-paths.test.mjs scripts/test/osm-dependency-recovery.test.mjs scripts/test/osm-closure-audit.test.mjs scripts/test/osm-adaptive-transport.test.mjs
      - name: Verify import OSM lifecycle guards
        run: node --test scripts/test/osm-refresh-routing.test.mjs
