name: AUTO-3 OSMB exception evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/auto3-osmb/**'
      - 'scripts/audit/auto3-osmb-*'
      - '.github/workflows/auto3-osmb-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/audits/auto3-osmb/**'
      - 'scripts/audit/auto3-osmb-*'
      - '.github/workflows/auto3-osmb-reconciliation.yml'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node scripts/audit/auto3-osmb-verify.mjs
      - run: python -m pip install shapely==2.2.0 pyproj==3.8.0 numpy==2.5.4
      - run: python scripts/audit/auto3-osmb-geometry-check.py
      - run: python scripts/audit/auto3-osmb-ro-source-history.py
      - run: python scripts/audit/auto3-osmb-md-source-history.py
      - run: python scripts/audit/auto3-osmb-md-remaining-histories.py
      - run: git diff --exit-code
