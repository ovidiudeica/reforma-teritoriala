name: RT-ADM.2.13 alternative official sector text comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audits/rt-adm2-13/**'
      - 'scripts/audit/rt-adm2-13-compare.mjs'
      - '.github/workflows/rt-adm2-13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-official-texts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - run: node scripts/audit/rt-adm2-13-compare.mjs
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rt-adm2-13-official-text-comparison
          path: outputs/RT-ADM.2.13/extraction-and-comparison.json

      - name: Gate six-sector documentary comparison
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('outputs/RT-ADM.2.13/extraction-and-comparison.json','utf8')); if(r.evidence_status!=='ALL_SIX_TEXT_PAIRS_AVAILABLE'){console.error('UNRESOLVED_OFFICIAL_DOCUMENTARY_EVIDENCE: '+r.evidence_status);process.exit(1)}"
