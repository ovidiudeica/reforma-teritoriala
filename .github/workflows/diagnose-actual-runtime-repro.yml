name: Diagnose ACTUAL OCI reproducibility

on:
  push:
    branches:
      - 'actual/pin-oci-runtime'
    paths:
      - '.github/workflows/diagnose-actual-runtime-repro.yml'

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Compare published image configs
        env:
          IMAGE: ghcr.io/ovidiudeica/reforma-teritoriala-actual-runtime
          A: sha256:fd64cf9dc89de53b2b1b796fd419b1891f90395c6e7be7adec08d89799f07396
          B: sha256:1704fb3457a9fd5b1220151f24e25dd48ae3062153dfcf833fdbb5c9ae58aea5
        run: |
          set -euo pipefail
          for D in "$A" "$B"; do docker pull "$IMAGE@$D" >/dev/null; done
          docker image inspect "$IMAGE@$A" | jq '.[0] | {Id,Created,Config,RootFS,History}' > /tmp/a.json
          docker image inspect "$IMAGE@$B" | jq '.[0] | {Id,Created,Config,RootFS,History}' > /tmp/b.json
          echo '=== A ==='
          cat /tmp/a.json
          echo '=== B ==='
          cat /tmp/b.json
          echo '=== DIFF ==='
          diff -u /tmp/a.json /tmp/b.json || true
