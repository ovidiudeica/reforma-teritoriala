name: OSM-ACQ.2c replication tail offline validation
on:
  pull_request:
    paths:
      - '.github/workflows/osm-acq2c-replication-tail.yml'
      - 'scripts/audit/osm_acq2c_replication_chain.py'
      - 'scripts/audit/test_osm_acq2c_replication_chain.py'
      - 'scripts/audit/osm_acq2c_acquire_history_base.py'
      - 'scripts/audit/test_osm_acq2c_acquire_history_base.py'
      - 'scripts/audit/osm_acq2c_bulk_preflight.py'
      - 'scripts/audit/osm_acq2c_full_batch.py'
      - 'scripts/audit/osm_acq2c_priority.py'
      - 'docs/evidence/osm-acq2b-way-history-20261022/combined-registry.json.gz'
      - 'docs/evidence/osm-acq2c-replication-tail-20261022/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: osm-acq2c-replication-tail-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Negative integrity, sequence and full-version parser tests
        run: |
          python scripts/audit/test_osm_acq2c_replication_chain.py
          python scripts/audit/test_osm_acq2c_acquire_history_base.py
      - name: Verify public evidence manifest; no network or original contributor data
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('docs/evidence/osm-acq2c-replication-tail-20261022')
          manifest=json.loads((root/'manifest-sha256.json').read_bytes())
          seen=set()
          for row in manifest['files']:
              name=row['name']
              assert name not in seen and pathlib.Path(name).name==name
              seen.add(name)
              raw=(root/name).read_bytes()
              assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
          assert seen=={p.name for p in root.iterdir() if p.is_file() and p.name!='manifest-sha256.json'}
          assert json.loads((root/'chain-audit.json').read_bytes())['source_qualified'] is False
          PY
